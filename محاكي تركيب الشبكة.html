                group.position.set(2.2, 1.07, 0.28);
                group.rotation.y = -0.24;

                const base = new THREE.Mesh(
                    new THREE.BoxGeometry(1.2, 0.055, 0.84),
                    new THREE.MeshStandardMaterial({ color: 0xbcc0c8, roughness: 0.32, metalness: 0.85 })
                );
                base.position.y = 0.028;
                base.castShadow = true;
                group.add(base);

                const keyboard = new THREE.Mesh(
                    new THREE.BoxGeometry(1.04, 0.01, 0.44),
                    new THREE.MeshStandardMaterial({ color: 0x1e293b })
                );
                keyboard.position.set(0, 0.058, -0.04);
                group.add(keyboard);

                const lidGroup = new THREE.Group();
                lidGroup.position.set(0, 0.055, -0.41);
                lidGroup.rotation.x = -0.22;
                const lid = new THREE.Mesh(
                    new THREE.BoxGeometry(1.2, 0.78, 0.04),
                    new THREE.MeshStandardMaterial({ color: 0xaeb3bc, roughness: 0.32, metalness: 0.85 })
                );
                lid.position.set(0, 0.39, 0);
                lid.castShadow = true;
                lidGroup.add(lid);

                const screen = new THREE.Mesh(
                    new THREE.PlaneGeometry(1.12, 0.70),
                    new THREE.MeshBasicMaterial({ map: createDeviceScreenTexture('laptop') })
                );
                screen.position.set(0, 0.39, 0.023);
                screen.userData = { action: 'os', device: 'laptop', tooltip: 'شاشة الحاسوب المحمول (انقر لفتح واجهة الجهاز)' };
                interactiveObjects.push(screen);
                screenMeshes.laptop = screen;
                lidGroup.add(screen);
                group.add(lidGroup);
                scene.add(group);
            };

            // Only the currently expected cable can be selected.
            const previousSelectCableTool = selectCableTool;
            selectCableTool = function (type) {
                const code = ({ fiber: 'fiber_cable', power: 'power_cable', rj45: 'ethernet_cable', usb: 'usb_cable' })[type];
                if (!code || !requireLessonTask(code)) return;
                return previousSelectCableTool(type);
            };

            const previousHandlePortClick = handlePortClick;
            handlePortClick = function (portId, portLabel) {
                if (selectedCableType) {
                    const code = ({ fiber: 'fiber_cable', power: 'power_cable', rj45: 'ethernet_cable', usb: 'usb_cable' })[selectedCableType];
                    if (!code || !requireLessonTask(code)) return;
                }
                return previousHandlePortClick(portId, portLabel);
            };

            // Device power can only be turned on at its assigned point in the lesson.
            const previousPowerOnDevice = powerOnDevice;
            powerOnDevice = function (device) {
                const code = ({ desktop: 'desktop_power', laptop: 'laptop_power', phone: 'phone_power' })[device];
                if (!code || !requireLessonTask(code)) return;
                return previousPowerOnDevice(device);
            };

            const previousToggleDevicePower = toggleDevicePower;
            toggleDevicePower = function (device) {
                const code = ({ desktop: 'desktop_power', laptop: 'laptop_power', phone: 'phone_power' })[device];
                if (!code || !requireLessonTask(code)) return;
                return previousToggleDevicePower(device);
            };

            // Central 3D click handler applies the same locks to physical controls and cable ports.
            handle3DClick = function (event) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects(interactiveObjects, false);
                if (!hits.length) return;
                const data = hits[0].object.userData;

                if (data.action === 'port') {
                    handlePortClick(data.portId, data.tooltip);
                } else if (data.action === 'os') {
                    playSound('click');
                    openDeviceOS(data.device);
                } else if (data.action === 'inspectSticker') {
                    if (!requireLessonTask('modem_sticker')) return;
                    networkState.inspectedModemBack = true;
                    playSound('success');
                    showToast('تمت معاينة بطاقة المودم وبيانات الدخول.', 'success');
                    syncAllUI();
                } else if (data.action === 'toggleModemPower') {
                    if (!requireLessonTask('modem_power')) return;
                    if (!networkState.cables.power) {
                        showToast('صِل محول الطاقة بالمودم أولاً.', 'warning');
                        return;
                    }
                    networkState.modemPowerOn = true;
                    playSound('success');
                    showToast('تم تشغيل المودم.', 'success');
                    syncAllUI();
                } else if (data.action === 'toggleDevicePower') {
                    toggleDevicePower(data.device);
                } else if (data.action === 'togglePrinterPower') {
                    if (!requireLessonTask('printer_power')) return;
                    networkState.printerPowerOn = true;
                    playSound('success');
                    showToast('تم تشغيل الطابعة.', 'success');
                    syncAllUI();
                } else if (data.action === 'cableTool') {
                    selectCableTool(data.cableType);
                } else if (data.action === 'viewPrintedPaper') {
                    openPrintedPaperModal();
                }
            };

            // Modem setup must follow inspection -> login -> configuration -> WLAN enablement.
            const previousAttemptModemLogin = attemptModemLogin;
            attemptModemLogin = function (device) {
                if (!requireLessonTask('modem_login')) return;
                return previousAttemptModemLogin(device);
            };

            const previousApplyModemWifiConfig = applyModemWifiConfig;
            applyModemWifiConfig = function () {
                if (!requireLessonTask('wifi_config')) return;
                return previousApplyModemWifiConfig();
            };

            const previousSetModemWifiEnabled = setModemWifiEnabled;
            setModemWifiEnabled = function (enabled) {
                if (enabled && !requireLessonTask('wifi_enable')) return;
                if (!enabled && networkState.wifiEnabled) {
                    showToast('لا يمكن إيقاف Wi-Fi بعد إكمال هذه الخطوة أثناء سير الحصة.', 'warning');
                    return;
                }
                return previousSetModemWifiEnabled(enabled);
            };

            // Client Wi-Fi switches are only usable during the matching connection task.
            window.setClientWifiToggle = function (device, enabled) {
                const code = device === 'laptop' ? 'laptop_wifi' : 'phone_wifi';
                if (!enabled) {
                    showToast('اترك اتصال الجهاز مفعّلاً لإكمال بقية أنشطة الشبكة.', 'warning');
                    return;
                }
                if (!requireLessonTask(code)) return;
                uiState[device].wifiToggle = true;
                renderActiveOS();
            };

            const previousBuildLaptopWifiPanel = buildLaptopWifiPanel;
            buildLaptopWifiPanel = function () {
                let html = previousBuildLaptopWifiPanel();
                html = html.replace(/onclick="uiState\.laptop\.wifiToggle=true;\s*renderActiveOS\(\)"/g,
                    'onclick="setClientWifiToggle(\'laptop\',true)"');
                html = html.replace(/onclick="uiState\.laptop\.wifiToggle=false;\s*renderActiveOS\(\)"/g,
                    'onclick="setClientWifiToggle(\'laptop\',false)"');
                html = html.replace(/onclick="uiState\.laptop\.wifiToggle=false;networkState\.laptopWifiConnected=false;syncAllUI\(\);renderActiveOS\(\)"/g,
                    'onclick="setClientWifiToggle(\'laptop\',false)"');
                html = html.replace(/onclick="networkState\.laptopWifiConnected=false;\s*syncAllUI\(\);\s*renderActiveOS\(\)"/g,
                    'onclick="disconnectWifiDevice(\'laptop\')"');
                return html;
            };

            window.disconnectWifiDevice = function (device) {
                showToast('لا يمكن قطع الاتصال أثناء تنفيذ الحصة؛ أكمل الخطوات بالترتيب.', 'warning');
            };

            const previousConnectWifiDevice = connectWifiDevice;
            connectWifiDevice = function (device, password) {
                const code = device === 'laptop' ? 'laptop_wifi' : device === 'phone' ? 'phone_wifi' : null;
                if (!code || !requireLessonTask(code)) return;
                return previousConnectWifiDevice(device, password);
            };

            const previousWatchYT = watchYT;
            watchYT = function (device, videoId) {
                const code = device === 'laptop' ? 'laptop_video' : device === 'phone' ? 'phone_video' : null;
                if (!code || !requireLessonTask(code)) return;
                return previousWatchYT(device, videoId);
            };

            const previousRenderPhoneOS = renderPhoneOS;
            renderPhoneOS = function () {
                previousRenderPhoneOS();
                const body = document.getElementById('os-body');
                if (!body) return;
                body.innerHTML = body.innerHTML
                    .replace(/onchange="uiState\.phone\.wifiToggle=this\.checked;if\(!this\.checked\)networkState\.phoneWifiConnected=false;syncAllUI\(\);renderActiveOS\(\)"/g,
                        'onchange="setClientWifiToggle(\'phone\',this.checked)"')
                    .replace(/onclick="networkState\.phoneWifiConnected=false;syncAllUI\(\);renderActiveOS\(\)"/g,
                        'onclick="disconnectWifiDevice(\'phone\')"')
                    .replace(/onclick="networkState\.localSendInstalled\.phone=true;playSound\('success'\);syncAllUI\(\);renderActiveOS\(\)"/g,
                        'onclick="installLocalSendForDevice(\'phone\')"');
            };

            // LocalSend installation order: desktop -> laptop -> phone.
            const previousRunLocalSendInstaller = runLocalSendInstaller;
            runLocalSendInstaller = function (device) {
                const code = ({ desktop: 'install_desktop', laptop: 'install_laptop' })[device];
                if (!code || !requireLessonTask(code)) return;
                return previousRunLocalSendInstaller(device);
            };

            window.installLocalSendForDevice = function (device) {
                if (device !== 'phone' || !requireLessonTask('install_phone')) return;
                networkState.localSendInstalled.phone = true;
                playSound('success');
                showToast('تم تثبيت LocalSend على الهاتف.', 'success');
                syncAllUI();
                renderActiveOS();
            };

            // Creating a normal file and saving to D: are two distinct, ordered tasks.
            const previousSaveNotepadFile = saveNotepadFile;
            saveNotepadFile = function (device) {
                const location = document.getElementById(`np-loc-${device}`)?.value || 'desktop';
                const code = device === 'desktop' && location === 'driveD' ? 'save_drive_d' : 'create_file';
                if (!requireLessonTask(code)) return;
                if (code === 'create_file' && device === 'desktop' && location === 'driveD') return;
                return previousSaveNotepadFile(device);
            };

            const previousSavePhoneNote = savePhoneNote;
            savePhoneNote = function () {
                if (!requireLessonTask('create_file')) return;
                return previousSavePhoneNote();
            };

            const previousSendLocalSend = sendLocalSend;
            sendLocalSend = function (fromDevice, toDevice) {
                if (!requireLessonTask('file_transfer')) return;
                const select = document.getElementById(`ls-sel-${fromDevice}`);
                const index = select ? parseInt(select.value, 10) : 0;
                const files = fromDevice === 'desktop'
                    ? [...networkState.fs.desktop.desktop, ...networkState.fs.desktop.driveD]
                    : fromDevice === 'laptop' ? networkState.fs.laptop.desktop : networkState.fs.phone.files;
                if (!files[index] || !files[index].custom) {
                    showToast('أرسل الملف النصي الذي أنشأته في الخطوة السابقة.', 'warning');
                    return;
                }
                return previousSendLocalSend(fromDevice, toDevice);
            };

            const previousRespondLocalSend = respondLocalSend;
            respondLocalSend = function (transferId, accept) {
                if (!requireLessonTask('file_transfer')) return;
                return previousRespondLocalSend(transferId, accept);
            };

            const previousSetDriveDShare = setDriveDShare;
            setDriveDShare = function (enabled) {
                if (!requireLessonTask('share_drive_d')) return;
                return previousSetDriveDShare(enabled);
            };

            const previousOpenSharedDriveD = openSharedDriveDFromLaptop;
            openSharedDriveDFromLaptop = function () {
                if (!requireLessonTask('access_drive_d')) return;
                return previousOpenSharedDriveD();
            };

            // Printer actions are locked in the order: share -> add -> print from laptop.
            const previousSetPrinterShared = setPrinterShared;
            setPrinterShared = function (enabled) {
                if (!requireLessonTask('share_printer')) return;
                return previousSetPrinterShared(enabled);
            };

            const previousAddLaptopNetworkPrinter = addLaptopNetworkPrinter;
            addLaptopNetworkPrinter = function () {
                if (!requireLessonTask('add_printer')) return;
                return previousAddLaptopNetworkPrinter();
            };

            const previousPrintTestPageFromLaptop = printTestPageFromLaptop;
            printTestPageFromLaptop = function () {
                if (!requireLessonTask('network_print')) return;
                return previousPrintTestPageFromLaptop();
            };

            const previousPrintFromNotepad = printFromNotepad;
            printFromNotepad = function (device) {
                if (device !== 'laptop') {
                    showToast('في هذا النشاط تتم الطباعة عبر الشبكة من الحاسوب المحمول بعد مشاركة الطابعة.', 'info');
                    return;
                }
                if (!requireLessonTask('network_print')) return;
                return previousPrintFromNotepad(device);
            };

            // Prevent jumping to future stages through the sidebar or direct function calls.
            const previousStartGuidedPhase = startGuidedPhase;
            startGuidedPhase = function (phaseId) {
                const current = currentLessonTask();
                if (!current) {
                    if (networkState.quizCompleted) openQuizModal();
                    return;
                }
                if (phaseId !== current.phase.id) {
                    showToast(`هذه المرحلة مقفلة. أكمل أولاً: ${current.task.text}.`, 'warning');
                    return;
                }
                // Open the exact device needed by the active task, including the laptop's on-screen power control.
                if (current.code === 'desktop_power') { openDeviceOS('desktop'); return; }
                if (current.code === 'laptop_power') { openDeviceOS('laptop'); return; }
                if (current.code === 'phone_power') { openDeviceOS('phone'); return; }
                if (current.code === 'printer_power') {
                    setCameraPreset('frontDevices', document.querySelectorAll('.cam-btn')[3]);
                    showToast('شغّل الطابعة من زر الطاقة الموجود على جسم الطابعة في المشهد ثلاثي الأبعاد.', 'info');
                    return;
                }
                if (current.code === 'phone_wifi') { openDeviceOS('phone'); uiState.phone.app = 'wifi'; renderActiveOS(); return; }
                if (current.code === 'laptop_video') { openDeviceOS('laptop'); openWinApp('laptop', 'browser'); navBrowser('laptop', 'youtube.com'); return; }
                if (current.code === 'phone_video') { openDeviceOS('phone'); uiState.phone.app = 'youtube'; renderActiveOS(); return; }
                if (current.code === 'file_transfer') { openDeviceOS('desktop'); openWinApp('desktop', 'localsend'); return; }
                return previousStartGuidedPhase(phaseId);
            };

            togglePhaseExpand = function (phaseId) {
                const phases = getPhasesData();
                const current = currentLessonTask();
                const targetIndex = phases.findIndex(phase => phase.id === phaseId);
                if (targetIndex < 0) return;
                if (current && targetIndex > current.phaseIndex) {
                    showToast(`هذه المرحلة مقفلة. أكمل أولاً: ${current.task.text}.`, 'warning');
                    return;
                }
                networkState.expandedPhases[phaseId] = !networkState.expandedPhases[phaseId];
                renderMissionsSidebar();
            };

            renderMissionsSidebar = function () {
                const phases = getPhasesData();
                const total = phases.reduce((sum, phase) => sum + phase.tasks.length, 0);
                const done = phases.reduce((sum, phase) => sum + phase.tasks.filter(task => task.done).length, 0);
                const percent = total ? Math.round((done / total) * 100) : 0;
                const progressText = document.getElementById('sidebar-progress-text');
                const progressBar = document.getElementById('sidebar-progress-bar');
                const headerBadge = document.getElementById('header-progress-badge');
                if (progressText) progressText.textContent = `${percent}%`;
                if (progressBar) progressBar.style.width = `${percent}%`;
                if (headerBadge) headerBadge.textContent = `${percent}%`;

                const list = document.getElementById('missions-list');
                if (!list) return;
                const current = currentLessonTask();
                const currentPhaseIndex = current ? current.phaseIndex : phases.length - 1;
                const currentPhase = phases[currentPhaseIndex];
                let guide = document.getElementById('guided-step-card');
                if (!guide) {
                    guide = document.createElement('section');
                    guide.id = 'guided-step-card';
                    list.parentNode.insertBefore(guide, list);
                }

                if (current) {
                    guide.innerHTML = `
                <div class="text-[10px] font-extrabold text-sky-200 mb-2">الخطوة المسموح بها الآن</div>
                <div class="text-xs font-extrabold text-white">${escapeLessonText(current.phase.title)}</div>
                <p class="text-[11px] text-white mt-1">${escapeLessonText(current.task.text)}</p>
                <p class="text-[10px] text-slate-400 mt-1">لن تُفتح الخطوة التالية إلا بعد إتمام هذه الخطوة.</p>
                <button class="lan-primary-btn w-full mt-2" onclick="startGuidedPhase(${current.phase.id})">متابعة الخطوة الحالية</button>`;
                } else {
                    guide.innerHTML = `
                <div class="text-[10px] font-extrabold text-emerald-300 mb-2">اكتملت جميع الخطوات</div>
                <p class="text-xs text-white">أتممت مراحل المخبر. يمكنك الآن مراجعة شهادة الإتمام.</p>
                <button class="lan-primary-btn w-full mt-2" onclick="openQuizModal()">عرض الشهادة</button>`;
                }

                list.innerHTML = phases.map((phase, phaseIndex) => {
                    const completedCount = phase.tasks.filter(task => task.done).length;
                    const allDone = completedCount === phase.tasks.length;
                    const locked = phaseIndex > currentPhaseIndex;
                    const isCurrent = phaseIndex === currentPhaseIndex;
                    const expanded = !locked && (
                        networkState.expandedPhases[phase.id] === true ||
                        (networkState.expandedPhases[phase.id] === undefined && isCurrent)
                    );
                    const firstPending = phase.tasks.findIndex(task => !task.done);
                    const taskMarkup = phase.tasks.map((task, taskIndex) => {
                        const laterTask = isCurrent && !task.done && taskIndex > firstPending;
                        const activeTask = isCurrent && !task.done && taskIndex === firstPending;
                        const icon = task.done ? 'fa-circle-check text-emerald-400' : laterTask ? 'fa-lock text-slate-600' : 'fa-circle text-sky-300';
                        const classes = task.done ? 'done' : activeTask ? 'is-next' : 'is-locked';
                        return `<div class="lan-task ${classes}"><i class="fa-solid ${icon} mt-1"></i><span>${escapeLessonText(task.text)}</span></div>`;
                    }).join('');

                    const headerState = allDone
                        ? '<i class="fa-solid fa-check"></i>'
                        : locked ? '<i class="fa-solid fa-lock"></i>' : String(phase.id);
                    const headClass = locked ? 'lan-phase-head is-locked' : 'lan-phase-head';
                    const headerButton = `<button class="${headClass}" ${locked ? 'disabled aria-disabled="true"' : `onclick="togglePhaseExpand(${phase.id})"`}>
                <span class="flex items-center gap-2"><b class="w-6 h-6 rounded-lg ${allDone ? 'bg-emerald-600' : locked ? 'bg-slate-800' : 'bg-slate-700'} flex items-center justify-center text-white text-[10px]">${headerState}</b><span class="lan-phase-title">${escapeLessonText(phase.title)}</span></span>
                <span class="text-[10px] text-slate-300">${completedCount}/${phase.tasks.length}</span></button>`;

                    const content = locked
                        ? `<div class="lan-phase-body locked-message"><i class="fa-solid fa-lock ml-1"></i> مقفلة. أكمل المرحلة السابقة لفتحها.</div>`
                        : expanded ? `<div class="lan-phase-body">
                    <p class="text-[10px] text-slate-400 my-2">${escapeLessonText(phase.goal || '')}</p>
                    <ol class="lan-step-list">${(phase.steps || []).map(step => `<li>${escapeLessonText(step)}</li>`).join('')}</ol>
                    ${taskMarkup}
                    ${phase.isQuizPhase && isCurrent ? `<button onclick="openQuizModal()" class="lan-primary-btn w-full mt-2">بدء التقييم الختامي</button>` : ''}
                    <details class="mt-2"><summary class="cursor-pointer text-[10px] font-bold text-amber-300">إرشادات وملاحظات</summary><p class="mt-2 p-2 rounded-lg bg-amber-950/30 text-[10px] text-amber-100">${escapeLessonText(phase.hint || '')}</p></details>
                    ${isCurrent ? `<button onclick="startGuidedPhase(${phase.id})" class="lan-secondary-btn w-full mt-2">فتح أدوات الخطوة الحالية</button>` : '<div class="text-[10px] text-emerald-300 mt-2">مرحلة مكتملة</div>'}
                </div>` : '';

                    return `<article class="lan-phase-card ${isCurrent ? 'is-current' : ''} ${allDone ? 'is-done' : ''} ${locked ? 'is-locked' : ''} mb-2">${headerButton}${content}</article>`;
                }).join('');

                const title = document.querySelector('#mission-sidebar h2');
                if (title) title.innerHTML = '<i class="fa-solid fa-graduation-cap text-sky-400 text-base"></i> خطة العمل التطبيقي (7 مراحل)';
            };

            // Quiz is inaccessible until every practical task in the six preceding phases is complete.
            const previousOpenQuizModal = openQuizModal;
            openQuizModal = function () {
                if (networkState.quizCompleted) return previousOpenQuizModal();
                if (!requireLessonTask('final_quiz')) return;
                return previousOpenQuizModal();
            };

            const previousSubmitQuiz = submitQuiz;
            submitQuiz = function () {
                if (!requireLessonTask('final_quiz')) return;
                return previousSubmitQuiz();
            };

            // Update the laptop task wording because its 3D power button has been removed.
            const previousGetPhasesData = getPhasesData;
            getPhasesData = function () {
                const phases = previousGetPhasesData();
                const first = phases.find(phase => phase.id === 1);
                if (first) {
                    first.hint = 'أكمل توصيل الكابلات بالترتيب. لتشغيل الحاسوب المحمول، افتح واجهته من زر «فتح المحمول»، ثم استخدم زر «تشغيل الجهاز» في شاشة الجهاز المتوقف.';
                    const laptopTask = first.tasks.find(task => task.text.includes('تشغيل الحاسوب المحمول'));
                    if (laptopTask) laptopTask.text = 'تشغيل الحاسوب المحمول من شاشة النظام الافتراضية.';
                }
                return phases;
            };

            const previousOnload = window.onload;
            window.onload = function () {
                if (typeof previousOnload === 'function') previousOnload();
                renderMissionsSidebar();
            };

            // Repaint the current-step guide whenever progress or device state changes.
            const previousSyncAllUI = syncAllUI;
            syncAllUI = function () {
                previousSyncAllUI();
                renderMissionsSidebar();
            };

            renderMissionsSidebar();
        })();
    </script>

</body>

</html>
