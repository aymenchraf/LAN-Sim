                networkState.dhcpChecked = true;
                showToast('ممتاز! لقد قمت بمعاينة جدول DHCP وعناوين IP و MAC للأجهزة المتصلة.', 'success');
                syncAllUI();
            }
            renderActiveOS();
        }

        function attemptModemLogin(dev) {
            const u = document.getElementById(`m-user-${dev}`).value.trim();
            const p = document.getElementById(`m-pass-${dev}`).value.trim();
            if (u === networkState.adminUser && p === networkState.adminPass) {
                networkState.modemLoggedIn = true;
                uiState.desktop.modemTab = 'wlan';
                playSound('success');
                showToast('تم تسجيل الدخول إلى المودم بنجاح!', 'success');
                syncAllUI();
                renderActiveOS();
            } else {
                playSound('error');
                showToast('بيانات الدخول خاطئة! راجع البطاقة خلف المودم (admin / Fiber@2026).', 'error');
            }
        }

        function applyModemWifiConfig() {
            const ssid = document.getElementById('wlan-ssid').value.trim();
            const sec = document.getElementById('wlan-sec').value;
            const pass = document.getElementById('wlan-pass').value.trim();

            if (!ssid || ssid === networkState.defaultSSID) {
                playSound('warning');
                showToast('يجب تغيير اسم الشبكة (SSID) عن الاسم الافتراضي!', 'warning');
                return;
            }
            if (sec === 'Open') {
                playSound('warning');
                showToast('لأمان الشبكة، اختر تشفير WPA2-PSK أو WPA3-SAE بدلاً من الشبكة المفتوحة!', 'warning');
                return;
            }
            if (pass.length < 8 || pass === networkState.defaultKey) {
                playSound('warning');
                showToast('يجب تعيين كلمة مرور جديدة قوية لا تقل عن 8 أحرف ومختلفة عن 12345678!', 'warning');
                return;
            }

            showToast('جاري حفظ الإعدادات وإعادة تشغيل وحدة Wi-Fi بالمودم...', 'info');
            setTimeout(() => {
                networkState.ssid = ssid;
                networkState.wifiSecurity = sec;
                networkState.wifiPass = pass;
                networkState.wifiConfigured = true;
                networkState.laptopWifiConnected = false;
                networkState.phoneWifiConnected = false;
                playSound('success');
                showToast(`تم تفعيل شبكة "${ssid}" بنجاح! يمكنك الآن ربط المحمول والهاتف بها.`, 'success');
                syncAllUI();
                renderActiveOS();
            }, 1200);
        }

        function buildYouTubeUI(dev) {
            const hasNet = hasInternet() && (dev === 'desktop' ? isDesktopOnLAN() : dev === 'laptop' ? isLaptopOnLAN() : isPhoneOnLAN());
            if (!hasNet) {
                return `<div class="py-10 text-center space-y-2"><i class="fa-solid fa-wifi text-4xl text-rose-400"></i><div class="text-sm font-extrabold text-white">لا يوجد اتصال بالإنترنت</div><p class="text-xs text-slate-400">تأكد من توصيل كابل الألياف البصرية (PON) واتصال الجهاز بالشبكة.</p></div>`;
            }
            const playing = YT_VIDEOS.find(v => v.id === activeVideoId);
            return `

                </button>
            </div>
        `;

        function runLocalSendInstaller(dev) {
            playSound('click');
            const btn = document.getElementById(`dl-btn-${dev}`);
            const prog = document.getElementById(`dl-prog-${dev}`);
            const bar = document.getElementById(`dl-bar-${dev}`);
            if (btn) btn.classList.add('hidden');
            if (prog) prog.classList.remove('hidden');
            let w = 0;
            const t = setInterval(() => {
                w += 25;
                if (bar) bar.style.width = w + '%';
                if (w >= 100) {
                    clearInterval(t);
                    networkState.localSendInstalled[dev] = true;
                    playSound('success');
                    showToast('تم تثبيت LocalSend بنجاح! ستجد أيقونته على سطح المكتب.', 'success');

        // -------------------------------------------------------------------------
        // موجه الأوامر التفاعلي (CMD Terminal: help, ipconfig, ping, cls)
        // -------------------------------------------------------------------------
        function buildCmdUI(dev) {
            const log = uiState[dev].cmdLog;
            return `
            <div class="h-full flex flex-col bg-black rounded-xl border border-slate-700 p-3 cmd-font text-xs text-emerald-300" dir="ltr">
                <div class="text-slate-400 mb-2 border-b border-slate-800 pb-2">
                    Microsoft Windows [Version 10.0.22631] — Lab Network CLI<br>
                    Type <span class="text-amber-300">help</span>, <span class="text-amber-300">ipconfig</span>, <span class="text-amber-300">ping 192.168.1.1</span>, <span class="text-amber-300">ping 192.168.1.3</span>, or <span class="text-amber-300">cls</span>
                </div>
                <div id="cmd-out-${dev}" class="flex-1 overflow-y-auto space-y-2 whitespace-pre-wrap text-[12px] leading-relaxed mb-2">
                    ${log.map(line => `<div>${line}</div>`).join('')}
                </div>
                <div class="flex items-center gap-2 border-t border-slate-800 pt-2">
                    <span class="text-sky-400 font-bold shrink-0">C:\\Users\\Student&gt;</span>
                    <input id="cmd-in-${dev}" onkeydown="if(event.key==='Enter') executeCmd('${dev}')" autofocus placeholder="Enter command..." class="flex-1 bg-transparent text-white focus:outline-none">
                    <button onclick="executeCmd('${dev}')" class="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-sky-300 text-[11px] font-sans font-bold">تنفيذ</button>
                </div>
            </div>
        `;
        }

        function executeCmd(dev) {
            const input = document.getElementById(`cmd-in-${dev}`);
            if (!input) return;
            const raw = input.value.trim();
            if (!raw) return;
            playSound('click');

            const parts = raw.toLowerCase().split(/\s+/);
            const cmd = parts[0];
            const log = uiState[dev].cmdLog;
            log.push(`<span class="text-sky-400">C:\\Users\\Student&gt;</span> <span class="text-white">${raw}</span>`);

            const onLAN = dev === 'desktop' ? isDesktopOnLAN() : isLaptopOnLAN();
            const myIP = dev === 'desktop' ? '192.168.1.2' : '192.168.1.3';

            if (cmd === 'cls' || cmd === 'clear') {
                uiState[dev].cmdLog = [];
            } else if (cmd === 'help') {
                log.push(`<span class="text-slate-300">Available commands:\n  ipconfig         Display IPv4 configuration\n  ping &lt;ip&gt;        Test connectivity (e.g., ping 192.168.1.1 or 192.168.1.3)\n  cls              Clear terminal screen</span>`);
            } else if (cmd === 'ipconfig') {
                networkState.cmdIpconfigRun = onLAN;
                if (!onLAN) {
                    log.push(`<span class="text-rose-400">Ethernet/Wi-Fi adapter:\n   Media State . . . . . . . . . . . : Media disconnected</span>`);
                } else {
                    log.push(`<span class="text-emerald-300">Windows IP Configuration\n\n${dev === 'desktop' ? 'Ethernet adapter Local Area Connection:' : 'Wireless LAN adapter Wi-Fi:'}\n   IPv4 Address. . . . . . . . . . . : ${myIP}\n   Subnet Mask . . . . . . . . . . . : 255.255.255.0\n   Default Gateway . . . . . . . . . : 192.168.1.1</span>`);
                    playSound('success');
                    showToast(`تم عرض إعدادات الشبكة (${myIP}) بنجاح!`, 'success');
                }
                syncAllUI();
            } else if (cmd === 'ping') {
                const target = parts[1];
                if (!target) {
                    log.push(`<span class="text-amber-300">Usage: ping &lt;IP address&gt; (example: ping 192.168.1.1)</span>`);
                } else if (!onLAN) {
                    log.push(`<span class="text-rose-400">PING: transmit failed. General failure (Device not connected to LAN).</span>`);
                } else {
                    const reachable =
                        (target === '192.168.1.1' && isModemActive()) ||
                        (target === '192.168.1.2' && isDesktopOnLAN()) ||
                        (target === '192.168.1.3' && isLaptopOnLAN()) ||
                        (target === '192.168.1.4' && isPhoneOnLAN());

                    if (reachable) {
                        networkState.cmdPingRun = true;
                        log.push(`<span class="text-emerald-300">Pinging ${target} with 32 bytes of data:\nReply from ${target}: bytes=32 time=2ms TTL=64\nReply from ${target}: bytes=32 time=1ms TTL=64\nReply from ${target}: bytes=32 time=2ms TTL=64\nReply from ${target}: bytes=32 time=1ms TTL=64\n\nPing statistics for ${target}:\n    Packets: Sent = 4, Received = 4, Lost = 0 (0% loss)</span>`);
                        playSound('success');
                        showToast(`نجح اختبار Ping نحو ${target} بدون فقدان للحزم!`, 'success');
                        syncAllUI();
                    } else {
                        log.push(`<span class="text-rose-400">Pinging ${target} with 32 bytes of data:\nRequest timed out.\nRequest timed out.\nRequest timed out.\nRequest timed out.\n\nPackets: Sent = 4, Received = 0, Lost = 4 (100% loss)</span>`);
                        playSound('error');
                    }
                }
            } else {
                log.push(`<span class="text-rose-400">'${cmd}' is not recognized as an internal command. Type 'help'.</span>`);
            }

            renderActiveOS();
            const out = document.getElementById(`cmd-out-${dev}`);
            if (out) out.scrollTop = out.scrollHeight;
        }

        // -------------------------------------------------------------------------
        // تطبيق LocalSend (إرسال واستقبال مع زر قبول Accept!)
        // -------------------------------------------------------------------------
        function buildLocalSendUI(dev) {
            const names = { desktop: 'DESKTOP-PC', laptop: 'LAPTOP-STUDENT', phone: 'Smartphone' };

            return `

                </div>

                <!-- طلبات الاستقبال المعلقة (Accept / Decline) -->
                ${pendingForMe.length ? `
                    <div class="p-3 rounded-xl bg-amber-950/50 border border-amber-400/60 space-y-2">
                        <div class="text-xs font-extrabold text-amber-300"><i class="fa-solid fa-bell ml-1 animate-bounce"></i>ملفات واردة تنتظر موافقتك:</div>
                        ${pendingForMe.map(t => `
                            <div class="p-2.5 rounded-lg bg-slate-950 flex flex-wrap items-center justify-between gap-2 text-xs">
                                <div>
                                    <div class="font-bold text-white">${t.file.name}</div>
                                    <div class="text-[10px] text-slate-400">المرسل: ${names[t.from]}</div>
                                </div>
                                <div class="flex gap-1.5">
                                    <button onclick="respondLocalSend('${t.id}', true)" class="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-extrabold">قبول (Accept)</button>
                                    <button onclick="respondLocalSend('${t.id}', false)" class="px-2.5 py-1 rounded-lg bg-rose-600/80 hover:bg-rose-600 text-white text-[11px] font-bold">رفض</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : ''}

                ${myIP ? `
                    <div class="p-3.5 rounded-xl bg-slate-900 border border-white/10 space-y-2.5">
                        <div class="text-xs font-extrabold text-teal-300">1) اختر أي ملف للإرسال (بما في ذلك ملفاتك المخصصة):</div>
                        <select id="ls-sel-${dev}" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-white text-xs">
                            ${allMyFiles.map((f, i) => `<option value="${i}">${f.name} (${f.size}) ${f.custom ? '★ مخصص' : ''}</option>`).join('')}
                        </select>
                        <div class="text-xs font-extrabold text-teal-300 pt-1">2) الأجهزة القريبة على الشبكة:</div>
                        ${peers.length === 0
                        ? `<div class="p-3 rounded-lg bg-slate-950 text-[11px] text-amber-300">لا توجد أجهزة أخرى جاهزة. تأكد من اتصالها بنفس الشبكة وتثبيت LocalSend عليها!</div>`
                        : peers.map(p => `
                                <div class="p-2.5 rounded-xl bg-slate-950 border border-teal-500/30 flex items-center justify-between">
                                    <div><div class="text-xs font-bold text-white">${names[p]}</div><div class="text-[10px] font-mono text-slate-400" dir="ltr">${ips[p]}</div></div>
                                    <button onclick="sendLocalSend('${dev}','${p}')" class="px-3.5 py-1.5 rounded-lg bg-teal-600 hover:bg-teal-500 text-white text-xs font-extrabold"><i class="fa-solid fa-paper-plane ml-1"></i>إرسال</button>
                                </div>
                            `).join('')}
                    </div>
                ` : ''}
            </div>
        `;
        }

        function sendLocalSend(fromDev, toDev) {
            const sel = document.getElementById(`ls-sel-${fromDev}`);
            const idx = sel ? parseInt(sel.value, 10) : 0;
            const list = fromDev === 'desktop'
                ? [...networkState.fs.desktop.desktop, ...networkState.fs.desktop.driveD]
                : fromDev === 'laptop' ? networkState.fs.laptop.desktop : networkState.fs.phone.files;
            const file = list[idx] || list[0];
            if (!file) return;

            networkState.pendingTransfers.push({ id: 'tr_' + Date.now(), from: fromDev, to: toDev, file: { ...file } });
            if (file.custom) networkState.localSendSentCustom = true;
            playSound('success');
            const names = { desktop: 'المكتبي', laptop: 'المحمول', phone: 'الهاتف' };
            showToast(`تم إرسال "${file.name}" إلى ${names[toDev]}! افتح LocalSend في ${names[toDev]} واضغط "قبول (Accept)".`, 'success');
            syncAllUI();
            renderActiveOS();
        }

        function respondLocalSend(transferId, accept) {
            const idx = networkState.pendingTransfers.findIndex(t => t.id === transferId);
            if (idx === -1) return;
            const tr = networkState.pendingTransfers.splice(idx, 1)[0];
            const names = { desktop: 'DESKTOP-PC', laptop: 'LAPTOP-STUDENT', phone: 'Smartphone' };

            if (accept) {
                networkState.fs[tr.to].downloads.unshift({ ...tr.file, from: names[tr.from] });
                networkState.localSendAccepted = true;
                playSound('success');
                showToast(`تم قبول واستلام "${tr.file.name}" وحفظه في التنزيلات بنجاح!`, 'success');
            } else {
                playSound('click');
                showToast('تم رفض استقبال الملف.', 'warning');
            }
            syncAllUI();
            renderActiveOS();
        }

            renderMissionsSidebar = function () {
                const phases = getPhasesData();
                const total = phases.reduce((sum, p) => sum + p.tasks.length, 0);
                const done = phases.reduce((sum, p) => sum + p.tasks.filter(t => t.done).length, 0);
                const pct = total ? Math.round(done / total * 100) : 0;
                const progressText = document.getElementById('sidebar-progress-text');
                const progressBar = document.getElementById('sidebar-progress-bar');
                const headerBadge = document.getElementById('header-progress-badge');
                if (progressText) progressText.textContent = pct + '%';
                if (progressBar) progressBar.style.width = pct + '%';
                if (headerBadge) headerBadge.textContent = pct + '%';

                const current = phases.find(p => !p.tasks.every(t => t.done)) || phases[phases.length - 1];
                const currentTask = current.tasks.find(t => !t.done) || current.tasks[0];
                const list = document.getElementById('missions-list');
                if (!list) return;

                let guide = document.getElementById('guided-step-card');
                if (!guide) {
                    guide = document.createElement('section');
                    guide.id = 'guided-step-card';
                    list.parentNode.insertBefore(guide, list);
                }
                guide.innerHTML = `

                            <div class="lan-small-label mt-2">خطوات التنفيذ</div>
                            <ol class="lan-step-list">${p.steps.map(s => `<li>${lanV2EscapeHtml(s)}</li>`).join('')}</ol>

            togglePhaseExpand = function (id) {
                networkState.expandedPhases[id] = !networkState.expandedPhases[id];
                renderMissionsSidebar();
            };

            startGuidedPhase = function (id) {
                playSound('click');
                if (id === 1) return openLearningActivity('orientation');
                if (id === 2) {
                    const nextCable = ['fiber', 'power', 'rj45', 'usb'].find(type => !networkState.cables[type]);
                    if (nextCable) return selectCableTool(nextCable);
                    setCameraPreset('frontDevices', document.querySelectorAll('.cam-btn')[3]);
                    if (!networkState.modemPowerOn) return showToast('الكابلات موصولة. انقر زر الطاقة الأحمر على المودم لتشغيله.', 'info');
                    if (!networkState.printerPowerOn) return showToast('شغّل الطابعة من زر الطاقة الموجود على واجهتها.', 'info');
                    return showToast('اكتمل التركيب. تحقق من إضاءة Power وPON ثم انتقل إلى إعداد Wi-Fi.', 'success');
                }
                if (id === 3) {
                    if (!networkState.inspectedModemBack) {
                        setCameraPreset('modemBack', document.querySelectorAll('.cam-btn')[1]);
                        showToast('انقر على بطاقة المعلومات خلف جهاز ONT لمعاينة بيانات الدخول.', 'info');
                        return;
                    }
                    openDeviceOS('desktop');
                    openWinApp('desktop', 'browser');
                    return;
                }
                if (id === 4) {
                    openDeviceOS('laptop');
                    uiState.laptop.wifiOpen = true;
                    renderActiveOS();
                    return;
                }
                if (id === 5) {
                    openDeviceOS('desktop');
                    openWinApp('desktop', 'cmd');
                    return;
                }
                if (id === 6) {
                    if (!networkState.localSendInstalled.desktop) { openDeviceOS('desktop'); openWinApp('desktop', 'browser'); }
                    else if (!networkState.localSendInstalled.laptop) { openDeviceOS('laptop'); openWinApp('laptop', 'browser'); }
                    else if (!networkState.localSendInstalled.phone) { openDeviceOS('phone'); }
                    else { openDeviceOS('desktop'); openWinApp('desktop', 'notepad'); }
                    return;
                }
                if (id === 7) {
                    if (!networkState.customFileSavedToD) { openDeviceOS('desktop'); openWinApp('desktop', 'notepad'); }
                    else if (!networkState.driveDShared || networkState.driveDPermission !== 'read') { openDeviceOS('desktop'); openWinApp('desktop', 'explorer'); }
                    else { openDeviceOS('laptop'); openWinApp('laptop', 'explorer'); }
                    return;
                }
                if (id === 8) {
                    const device = networkState.printerShared ? 'laptop' : 'desktop';
                    openDeviceOS(device);
                    openWinApp(device, 'printers');
                    return;
                }
                if (id === 9) return openLearningActivity('troubleshooting');
                if (id === 10) return openQuizModal();
            };

            openLearningActivity = function (type) {
                const cfg = lanV2Activities[type];
                if (!cfg) return;
                const modal = document.getElementById('modal-overlay');
                const box = document.getElementById('modal-content');
                box.innerHTML = `
            <div class="p-4 bg-slate-800 border-b border-white/10 flex items-start justify-between gap-3">
                <div><div class="text-sm font-extrabold text-sky-300">${lanV2EscapeHtml(cfg.title)}</div><p class="text-[10.5px] text-slate-300 mt-1">${lanV2EscapeHtml(cfg.subtitle)}</p></div>
                <button onclick="closeModal()" class="text-slate-300 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-4 space-y-4 overflow-y-auto">
                ${cfg.questions.map((q, qi) => `
                    <section class="rounded-xl bg-slate-950/80 border border-white/10 p-3 space-y-2">
                        <div class="text-[11px] font-extrabold text-white leading-relaxed">${qi + 1}. ${lanV2EscapeHtml(q.q)}</div>
                        <div class="space-y-1.5">${q.opts.map((opt, oi) => `
                            <label class="lan-activity-option"><input type="radio" name="lan_${type}_${qi}" value="${oi}"><span>${lanV2EscapeHtml(opt)}</span></label>
                        `).join('')}</div>
                    </section>
                `).join('')}
            </div>
            <div class="p-4 bg-slate-800 border-t border-white/10 flex items-center justify-between gap-2">
                <span class="text-[10px] text-slate-400">شرط الاجتياز: ${cfg.pass} من ${cfg.questions.length}</span>
                <button onclick="submitLearningActivity('${type}')" class="lan-primary-btn">تصحيح النشاط</button>
            </div>
        `;
                modal.classList.remove('hidden');
            };

            submitLearningActivity = function (type) {
                const cfg = lanV2Activities[type];
                if (!cfg) return;
                let score = 0;
                for (let i = 0; i < cfg.questions.length; i++) {
                    const selected = document.querySelector(`input[name="lan_${type}_${i}"]:checked`);
                    if (!selected) {
                        showToast('أجب عن جميع الأسئلة قبل تصحيح النشاط.', 'warning');
                        return;
                    }
                    if (Number(selected.value) === cfg.questions[i].ans) score++;
                }
                const passed = score >= cfg.pass;
                networkState[cfg.scoreKey] = Math.max(networkState[cfg.scoreKey] || 0, score);
                networkState[cfg.doneKey] = Boolean(networkState[cfg.doneKey] || passed);
                playSound(passed ? 'success' : 'error');
                syncAllUI();
                const box = document.getElementById('modal-content');
                box.innerHTML = `
            <div class="p-4 bg-slate-800 border-b border-white/10 flex items-center justify-between">
                <span class="font-extrabold text-sm ${passed ? 'text-emerald-300' : 'text-amber-300'}">${passed ? 'تم اجتياز النشاط' : 'تحتاج إلى مراجعة ثم إعادة المحاولة'}</span>
                <button onclick="closeModal()" class="text-slate-300"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-5 space-y-3 overflow-y-auto">
                <div class="text-center p-4 rounded-xl bg-slate-950 border border-white/10">
                    <div class="text-3xl font-black ${passed ? 'text-emerald-400' : 'text-amber-300'}">${score} / ${cfg.questions.length}</div>
                    <p class="text-[11px] text-slate-300 mt-1">${passed ? 'أصبحت هذه المهمة مكتملة ضمن خطة العمل.' : `يلزم الحصول على ${cfg.pass} إجابات صحيحة على الأقل.`}</p>
                </div>
                ${cfg.questions.map((q, i) => `
                    <div class="p-3 rounded-xl bg-slate-950/70 border border-white/10">
                        <div class="text-[10.5px] font-extrabold text-white">${i + 1}. ${lanV2EscapeHtml(q.q)}</div>
                        <div class="text-[10px] text-emerald-300 mt-1">الإجابة الصحيحة: ${lanV2EscapeHtml(q.opts[q.ans])}</div>
                        <p class="text-[10px] leading-relaxed text-slate-400 mt-1">${lanV2EscapeHtml(q.why)}</p>
                    </div>
                `).join('')}
            </div>
            <div class="p-4 bg-slate-800 border-t border-white/10 flex justify-end gap-2">
                ${passed ? '<button onclick="closeModal(); renderMissionsSidebar()" class="lan-primary-btn">العودة إلى خطة العمل</button>' : `<button onclick="openLearningActivity('${type}')" class="lan-primary-btn">إعادة المحاولة</button>`}
            </div>
        `;
            };

            // Camera movement must not mark the label as inspected; the learner has to click the label itself.
            setCameraPreset = function (presetName, btnEl) {
                const preset = CAMERA_PRESETS[presetName];
                if (!preset) return;
                playSound('click');
                camTargetPos = preset.pos.clone();
                camTargetLook = preset.look.clone();
                document.querySelectorAll('.cam-btn').forEach(btn => btn.classList.remove('active'));
                if (btnEl) btnEl.classList.add('active');
            };

            // Refine the render pipeline and add restrained lab details without introducing decorative clutter.
            const lanV2OriginalInitThreeJS = initThreeJS;
            initThreeJS = function () {
                lanV2OriginalInitThreeJS();
                if (renderer) {
                    renderer.outputEncoding = THREE.sRGBEncoding;
                    renderer.toneMapping = THREE.ACESFilmicToneMapping;
                    renderer.toneMappingExposure = 1.08;
                    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                }
                if (scene) {
                    const hemi = new THREE.HemisphereLight(0xf2f7ff, 0x9a8f84, 0.2);
                    hemi.position.set(0, 8, 0);
                    scene.add(hemi);
                    const keyLight = new THREE.SpotLight(0xfff4df, 0.75, 18, Math.PI / 4, 0.45, 1.3);
                    keyLight.position.set(0, 7, 2.5);
                    keyLight.target.position.set(0, 1, 0);
                    keyLight.castShadow = true;
                    keyLight.shadow.mapSize.set(1024, 1024);
                    scene.add(keyLight);
                    scene.add(keyLight.target);
                    const fillLight = new THREE.PointLight(0x9ac8ff, 0.28, 10);
                    fillLight.position.set(3.8, 3.4, 1.5);
                    scene.add(fillLight);
                    buildLanLabTrim();
                }
            };

            function buildLanLabTrim() {
                const addBox = (w, h, d, x, y, z, color, roughness = 0.72) => {
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness }));
                    mesh.position.set(x, y, z);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    scene.add(mesh);
                    return mesh;
                };
                // Wall skirting and a subtle cable duct make the lab feel like a functional room.
                addBox(23.8, 0.18, 0.12, 0, 0.13, -3.43, 0x8d97a5, 0.8);
                addBox(0.08, 1.12, 0.08, -3.35, 0.88, -3.28, 0xe2e8f0, 0.68);
                addBox(0.08, 0.08, 2.1, -3.35, 0.34, -2.25, 0xe2e8f0, 0.68);
                // A restrained desk mat, keyboard key rows and mouse detail add scale without competing with the devices.
                const mat = addBox(1.55, 0.018, 0.58, -0.23, 1.082, 0.33, 0x2a313b, 0.92);
                mat.castShadow = false;
                const keyMat = new THREE.MeshStandardMaterial({ color: 0xaab2bf, roughness: 0.6 });
                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 13; col++) {
                        const key = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.012, 0.045), keyMat);
                        key.position.set(-0.73 + col * 0.07, 1.125, 0.19 + row * 0.09);
                        scene.add(key);
                    }
                }
                const mouseLine = new THREE.Mesh(new THREE.TorusGeometry(0.018, 0.006, 6, 14), new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.5 }));
                mouseLine.position.set(0.59, 1.126, 0.26);
                scene.add(mouseLine);
            }

            // Prevent a decorative sound control from distracting learners during the activity.
            const lanV2PreviousOnload = window.onload;
            window.onload = function () {
                if (typeof lanV2PreviousOnload === 'function') lanV2PreviousOnload();
                soundEnabled = false;
                const soundButton = document.querySelector('button[onclick="toggleSound()"]');

            // A passing score is required for the certificate; unsuccessful attempts remain retryable.
            submitQuiz = function () {
                let score = 0;
                for (let i = 0; i < QUIZ_QUESTIONS.length; i++) {
                    const checked = document.querySelector(`input[name="q_${i}"]:checked`);
                    if (!checked) {
                        showToast('أجب عن الأسئلة الثمانية قبل تصحيح الاختبار.', 'warning');
                        return;
                    }
                    if (parseInt(checked.value, 10) === QUIZ_QUESTIONS[i].ans) score++;
                }
                networkState.quizScore = score;
                if (score < 6) {
                    networkState.quizCompleted = false;
                    syncAllUI();
                    const box = document.getElementById('modal-content');
                    box.innerHTML = `
                <div class="p-4 bg-slate-800 border-b border-white/10"><span class="text-sm font-extrabold text-amber-300">نتيجة التقييم</span></div>

                    <button onclick="openQuizModal()" class="lan-primary-btn">إعادة الاختبار</button>

            `;
                    return;

                playSound('success');
                syncAllUI();
                renderCertificateInModal();
            };

            renderCertificateInModal = function () {

                const mins = Math.max(1, Math.round((Date.now() - networkState.startTime) / 60000));
                const name = lanV2EscapeHtml((networkState.studentName || '').trim() || 'تلميذ مخبر المعلوماتية');

                const doneCount = phases.filter(p => p.tasks.every(t => t.done)).length;
                box.innerHTML = `

                    <div><div class="text-xs font-bold text-sky-300">مادة المعلوماتية • التعليم الثانوي</div><h2 class="text-xl sm:text-2xl font-black text-white mt-1">شهادة إتمام مخبر الشبكة المحلية (LAN)</h2></div>
                    <p class="text-xs sm:text-sm text-slate-300">يشهد المحاكي التفاعلي بأن التلميذ(ة):</p>
                    <div class="text-xl font-extrabold text-amber-300 py-2 px-6 bg-slate-950/70 rounded-2xl inline-block border border-amber-400/30">${name}</div>
                    <p class="text-xs text-slate-300 max-w-md mx-auto leading-relaxed">قد أتمّ أنشطة تركيب الشبكة، تأمين Wi-Fi، فحص IPv4 وDHCP وPing، مشاركة الملفات والموارد، وتشخيص الأعطال الأساسية.</p>
                    <div class="grid grid-cols-3 gap-2 pt-2 text-xs">

                        <div class="p-2.5 rounded-xl bg-slate-950/80 border border-white/10"><div class="text-slate-400 text-[10px]">المدة المستغرقة</div><div class="text-base font-extrabold text-amber-300">${mins} دقيقة</div></div>
                    </div>
                </div>
            </div>
            <div class="p-3.5 bg-slate-800 flex justify-between items-center">
                <button onclick="networkState.quizCompleted=false; openQuizModal()" class="px-3.5 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold">إعادة الاختبار</button>
                <div class="flex gap-2"><button onclick="window.print()" class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-extrabold"><i class="fa-solid fa-print ml-1"></i>طباعة الشهادة</button><button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold">إغلاق</button></div>
            </div>
        `;
            };
        })();
    </script>

            .edge-page {
                padding: 12px
            }

            .edge-browser {
                min-height: 360px
            }

            .edge-tabs {
                padding-top: 5px
            }

            .edge-tab {
                min-width: 120px
            }
        }
    </style>
    <script>
        (() => {
            // Default power states: every endpoint, radio and shared service starts disabled.
            networkState.desktopPowerOn = false;
            networkState.laptopPowerOn = false;
            networkState.phonePowerOn = false;
            networkState.wifiEnabled = false;
            uiState.phone.wifiToggle = false;
            uiState.laptop.wifiToggle = false;
            uiState.desktop.browserHistory = [];
            uiState.laptop.browserHistory = [];
            uiState.desktop.quickSettingsOpen = false;
            uiState.laptop.quickSettingsOpen = false;

            const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const deviceIsOn = device => device === 'desktop' ? networkState.desktopPowerOn : device === 'laptop' ? networkState.laptopPowerOn : networkState.phonePowerOn;

            // Power-state-aware network membership.
            isDesktopOnLAN = () => networkState.desktopPowerOn && isModemActive() && networkState.cables.rj45;
            isLaptopOnLAN = () => networkState.laptopPowerOn && isModemActive() && networkState.wifiEnabled && uiState.laptop.wifiToggle && networkState.laptopWifiConnected;
            isPhoneOnLAN = () => networkState.phonePowerOn && isModemActive() && networkState.wifiEnabled && uiState.phone.wifiToggle && networkState.phoneWifiConnected;

            function renderOffScreen(device) {
                const phone = device === 'phone';
                const title = device === 'desktop' ? 'الحاسوب المكتبي' : device === 'laptop' ? 'الحاسوب المحمول' : 'الهاتف الذكي';
                const system = phone ? 'Android' : 'Windows 11';
                document.getElementById('os-body').innerHTML = `
            <div class="device-off-screen w-full h-full flex items-center justify-center p-5">
                <div class="max-w-md w-full text-center space-y-5">
                    <div class="w-20 h-20 rounded-3xl mx-auto flex items-center justify-center bg-slate-800/80 border border-slate-600/50 text-slate-500 text-4xl shadow-2xl">
                        <i class="${phone ? 'fa-brands fa-android' : 'fa-brands fa-windows'}"></i>
                    </div>
                    <div><div class="text-lg font-extrabold text-slate-200">${title} متوقف</div><p class="text-xs text-slate-500 mt-1">${system} • الجهاز مطفأ حالياً</p></div>
                    <p class="text-xs text-slate-400 leading-relaxed">شغّل الجهاز للبدء في استخدام تطبيقاته وإعداداته. يمكنك الضغط على زر الطاقة في النموذج ثلاثي الأبعاد أو استعمال الزر أدناه.</p>
                    <button onclick="powerOnDevice('${device}')" class="px-6 py-3 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-sm font-extrabold shadow-lg"><i class="fa-solid fa-power-off ml-2"></i>تشغيل الجهاز</button>
                </div>
            </div>`;
            }

            powerOnDevice = function (device) {
                if (device === 'desktop') networkState.desktopPowerOn = true;
                else if (device === 'laptop') networkState.laptopPowerOn = true;
                else if (device === 'phone') networkState.phonePowerOn = true;
                playSound('success');
                updateScreensTextures3D();
                updateDevicePowerStatus3D();
                syncAllUI();
                if (networkState.activeOS === device) renderActiveOS();
                showToast(`تم تشغيل ${device === 'desktop' ? 'الحاسوب المكتبي' : device === 'laptop' ? 'الحاسوب المحمول' : 'الهاتف الذكي'}.`, 'success');
            };

            toggleDevicePower = function (device) {
                const next = !deviceIsOn(device);
                if (device === 'desktop') networkState.desktopPowerOn = next;
                else if (device === 'laptop') networkState.laptopPowerOn = next;
                else if (device === 'phone') networkState.phonePowerOn = next;
                if (!next) {
                    if (device === 'laptop') networkState.laptopWifiConnected = false;
                    if (device === 'phone') networkState.phoneWifiConnected = false;
                    if (uiState[device]) { uiState[device].app = null; uiState[device].startOpen = false; }
                    if (device === 'phone') uiState.phone.app = 'home';
                }
                playSound(next ? 'success' : 'click');
                updateScreensTextures3D();
                updateDevicePowerStatus3D();
                syncAllUI();
                if (networkState.activeOS === device) renderActiveOS();
                showToast(`${device === 'desktop' ? 'الحاسوب المكتبي' : device === 'laptop' ? 'الحاسوب المحمول' : 'الهاتف'} ${next ? 'قيد التشغيل' : 'مطفأ'}.`, next ? 'success' : 'warning');
            };

            updateDevicePowerStatus3D = function () {
                if (ringMats.tower) ringMats.tower.color.setHex(networkState.desktopPowerOn ? 0x22c55e : 0x475569);
                if (ringMats.laptop) ringMats.laptop.color.setHex(networkState.laptopPowerOn ? 0x22c55e : 0x475569);
                if (ringMats.phone) ringMats.phone.color.setHex(networkState.phonePowerOn ? 0x22c55e : 0x475569);
                if (virtualDevicePowerLEDs.desktop) {
                    virtualDevicePowerLEDs.desktop.emissive.setHex(networkState.desktopPowerOn ? 0x0284c7 : 0x000000);
                    virtualDevicePowerLEDs.desktop.emissiveIntensity = networkState.desktopPowerOn ? 1.3 : 0;
                    virtualDevicePowerLEDs.desktop.color.setHex(networkState.desktopPowerOn ? 0x38bdf8 : 0x263241);
                }
            };

            // Black screens while off; powered screens use recognizable operating-system styling.
            createDeviceScreenTexture = function (deviceType) {
                const c = document.createElement('canvas');
                c.width = 512; c.height = deviceType === 'phone' ? 512 : 320;
                const x = c.getContext('2d');
                const on = deviceIsOn(deviceType);
                if (!on) {
                    x.fillStyle = '#03060b'; x.fillRect(0, 0, c.width, c.height);
                    x.fillStyle = '#3b4657'; x.textAlign = 'center'; x.font = 'bold 20px Arial';
                    x.fillText('POWER OFF', c.width / 2, c.height / 2 - 4);
                    x.font = '14px Arial'; x.fillStyle = '#667386'; x.fillText('انقر زر الطاقة للتشغيل', c.width / 2, c.height / 2 + 25);
                } else if (deviceType === 'phone') {
                    const g = x.createLinearGradient(0, 0, 512, 512); g.addColorStop(0, '#123b5a'); g.addColorStop(.55, '#1d6980'); g.addColorStop(1, '#10233f');
                    x.fillStyle = g; x.fillRect(0, 0, 512, 512); x.fillStyle = 'rgba(255,255,255,.12)'; x.beginPath(); x.arc(390, 120, 135, 0, Math.PI * 2); x.fill();
                    x.fillStyle = '#fff'; x.textAlign = 'center'; x.font = '48px Arial'; x.fillText('10:30', 256, 150); x.font = '18px Arial'; x.fillStyle = '#dbeafe'; x.fillText('Android', 256, 190);
                    x.fillStyle = '#e2e8f0'; x.font = '17px Arial'; x.fillText(isPhoneOnLAN() ? 'متصل بالشبكة' : 'Wi-Fi غير متصل', 256, 430);
                } else {
                    const g = x.createLinearGradient(0, 0, 512, 320); g.addColorStop(0, '#071a3b'); g.addColorStop(.48, '#0754a0'); g.addColorStop(1, '#19235b');
                    x.fillStyle = g; x.fillRect(0, 0, 512, 320); x.fillStyle = 'rgba(28,151,255,.42)'; x.beginPath(); x.ellipse(330, 155, 210, 105, -.35, 0, Math.PI * 2); x.fill();
                    x.fillStyle = 'rgba(255,255,255,.9)'; x.font = 'bold 34px Arial'; x.textAlign = 'center'; x.fillText('Windows 11', 256, 145);
                    x.fillStyle = '#dbeafe'; x.font = '17px Arial'; x.fillText(deviceType === 'desktop' ? 'DESKTOP-PC' : 'LAPTOP-STUDENT', 256, 180);
                    x.fillStyle = '#e0f2fe'; x.font = '15px Arial'; x.fillText('مرحباً بك', 256, 228);
                }
                const tex = new THREE.CanvasTexture(c); tex.needsUpdate = true; return tex;
            };

            // A first endpoint immediately receives its plug and a visible, dangling cable section.
            function createPartialPhysical3DCable(type, portId) {
                disposeCable(type);
                const hit = portMeshes[portId];
                if (!hit || !hit.userData.frame) return;
                const frame = hit.userData.frame;
                const p = new THREE.Vector3(), q = new THREE.Quaternion();
                frame.getWorldPosition(p); frame.getWorldQuaternion(q);
                const n = new THREE.Vector3(0, 0, 1).applyQuaternion(q).normalize();
                const plug = buildPlug(type, portId); plug.position.copy(p); plug.quaternion.copy(q);
                const start = p.clone().addScaledVector(n, plug.userData.exit);
                const loose = start.clone().addScaledVector(n, 0.72);
                loose.y = Math.max(0.55, loose.y - 0.24);
                loose.x += (portId.startsWith('modem_') ? -0.24 : 0.22);
                const mid1 = start.clone().lerp(loose, 0.34); mid1.y -= 0.10;
                const mid2 = start.clone().lerp(loose, 0.72); mid2.y -= 0.18;
                const curve = new THREE.CatmullRomCurve3([start, mid1, mid2, loose]);
                const group = new THREE.Group(); group.add(plug);
                const rule = CABLE_RULES[type];
                const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, rule.radius, 9, false), std(rule.color, { roughness: .45 }));
                tube.castShadow = true; group.add(tube);
                const oppositePort = { fiber: { pto: 'modem_pon', modem_pon: 'pto' }, power: { power_strip: 'modem_dc', modem_dc: 'power_strip' }, rj45: { pc_rj45: networkState.cables.rj45Port || 'modem_lan1', modem_lan1: 'pc_rj45', modem_lan2: 'pc_rj45' }, usb: { printer_usb: 'pc_usb', pc_usb: 'printer_usb' } };
                const loosePortId = (oppositePort[type] && oppositePort[type][portId]) || portId;
                const looseQ = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), n.clone().negate());
                const loosePlug = buildPlug(type, loosePortId); loosePlug.position.copy(loose); loosePlug.quaternion.copy(looseQ); loosePlug.scale.setScalar(.82); group.add(loosePlug);
                group.userData.partial = true; group.userData.portId = portId; scene.add(group); cableMeshes3D[type] = group;
            }

            cancelCableSelection = function () {
                if (selectedCableType && selectedFirstPortId && !networkState.cables[selectedCableType]) disposeCable(selectedCableType);
                selectedCableType = null; selectedFirstPortId = null;
                document.getElementById('cabling-banner').classList.add('hidden');
                updateCableToolbarUI(); highlightValidPorts();
            };

            selectCableTool = function (cableType) {
                playSound('click');
                if (networkState.cables[cableType]) { disconnectCable(cableType); return; }
                if (selectedCableType && selectedCableType !== cableType) cancelCableSelection();
                if (selectedCableType === cableType) { cancelCableSelection(); return; }
                selectedCableType = cableType; selectedFirstPortId = null;
                if (cableType === 'fiber' || cableType === 'power') setCameraPreset('modemBack', document.querySelectorAll('.cam-btn')[1]);
                else setCameraPreset('pcPrinterBack', document.querySelectorAll('.cam-btn')[2]);
                updateCableToolbarUI();
                document.getElementById('cabling-banner-text').textContent = `${CABLE_RULES[cableType].label}: ${CABLE_RULES[cableType].hint}`;
                document.getElementById('cabling-banner').classList.remove('hidden');
                highlightValidPorts();
            };

            const originalUpdateCableToolbarUI = updateCableToolbarUI;
            updateCableToolbarUI = function () {
                originalUpdateCableToolbarUI();
                if (selectedCableType && selectedFirstPortId) {
                    const b = document.getElementById('tool-cable-' + selectedCableType);
                    const badge = b && b.querySelector('.cable-badge');
                    if (badge) { badge.textContent = 'الطرف الأول مثبت'; badge.className = 'cable-badge text-[10px] px-1.5 py-0.5 rounded bg-sky-500/30 text-sky-200 font-bold'; }
                }
            };

            handlePortClick = function (portId, portLabel) {
                if (!selectedCableType) { showToast(`هذا هو ${portLabel}. اختر الكابل المناسب أولاً.`, 'info'); playSound('click'); return; }
                const type = selectedCableType, rule = CABLE_RULES[type];
                if (!rule.validPorts.includes(portId)) { playSound('error'); showToast(`لا يمكن توصيل ${rule.label} بهذا المنفذ.`, 'error'); return; }
                if (!selectedFirstPortId) {
                    selectedFirstPortId = portId;
                    createPartialPhysical3DCable(type, portId);
                    playSound('plug');
                    document.getElementById('cabling-banner-text').textContent = `تم تثبيت الطرف الأول في ${portLabel}. أصبح الكابل ظاهراً؛ اختر الآن المنفذ المقابل.`;
                    updateCableToolbarUI(); highlightValidPorts();
                    showToast('تم تثبيت الطرف الأول. لاحظ ظهور الكابل من المنفذ قبل اختيار الطرف الثاني.', 'success');
                    return;
                }
                if (selectedFirstPortId === portId) { showToast('هذا الطرف محدد بالفعل. اختر منفذاً آخر للطرف الثاني.', 'warning'); return; }
                if (type === 'rj45' && selectedFirstPortId.startsWith('modem_lan') && portId.startsWith('modem_lan')) { playSound('error'); showToast('اختر منفذ RJ45 في الحاسوب المكتبي للطرف الثاني.', 'error'); return; }
                if (type === 'rj45') networkState.cables.rj45Port = selectedFirstPortId.startsWith('modem_lan') ? selectedFirstPortId : portId;
                networkState.cables[type] = true;
                createPhysical3DCable(type, selectedFirstPortId, portId);
                playSound('success'); showToast(`اكتمل توصيل ${rule.label} بين المنفذين.`, 'success');
                cancelCableSelection(); syncAllUI();
            };

            const oldDisconnectCable = disconnectCable;
            disconnectCable = function (type) {
                oldDisconnectCable(type);
                if (selectedCableType === type) cancelCableSelection();
            };

            // Require the modem WLAN radio and the client radio to be explicitly enabled.
            setModemWifiEnabled = function (enabled) {
                if (enabled && !isModemActive()) { showToast('شغّل المودم أولاً قبل تفعيل Wi-Fi.', 'warning'); renderActiveOS(); return; }
                networkState.wifiEnabled = Boolean(enabled);
                if (!networkState.wifiEnabled) { networkState.laptopWifiConnected = false; networkState.phoneWifiConnected = false; }
                playSound(enabled ? 'success' : 'click'); syncAllUI(); renderActiveOS();
            };

            const originalBuildModemWebUI = buildModemWebUI;
            buildModemWebUI = function (dev) {
                if (uiState.desktop.modemTab === 'dhcp') uiState.desktop.modemTab = 'status';
                let html = originalBuildModemWebUI(dev);
                html = html.replace(/<button onclick="setModemTab\('dhcp'\)"[\s\S]*?<\/button>/, '');
                html = html.replace(/الأجهزة المتصلة \(DHCP\)/g, 'الأجهزة المتصلة');
                html = html.replace(/جدول توزيع عناوين IP التلقائي \(DHCP Client Table\):/g, 'الأجهزة المتصلة بالشبكة:');
                const switchBox = `<div class="rounded-xl border border-slate-200 bg-slate-50 p-3 mb-3 flex items-center justify-between gap-3 text-slate-800"><div><div class="text-xs font-extrabold">تشغيل شبكة Wi-Fi</div><div class="text-[10px] text-slate-500 mt-1">${networkState.wifiEnabled ? 'الشبكة اللاسلكية مفعّلة ويمكن للأجهزة البحث عنها.' : 'الشبكة اللاسلكية متوقفة حالياً.'}</div></div><label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" ${networkState.wifiEnabled ? 'checked' : ''} onchange="setModemWifiEnabled(this.checked)" class="sr-only peer"><span class="w-11 h-6 bg-slate-300 rounded-full peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-0.5 after:right-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:-translate-x-5"></span></label></div>`;
                html = html.replace('<div class="max-w-lg bg-slate-950 p-4 rounded-xl border border-white/10 space-y-3 text-xs">', switchBox + '<div class="max-w-lg bg-slate-950 p-4 rounded-xl border border-white/10 space-y-3 text-xs">');
                html = html.replace(/عدد الأجهزة المتصلة:<\/span><span class="font-bold text-sky-300">[^<]*<\/span>/, `حالة Wi-Fi:</span><span class="font-bold text-sky-300">${networkState.wifiEnabled ? 'مفعّلة' : 'مطفأة'}</span>`);
                return html;
            };

            setModemTab = function (tab) {
                if (!['status', 'wlan'].includes(tab)) tab = 'status';
                playSound('click'); uiState.desktop.modemTab = tab; renderActiveOS();
            };

            const originalBuildLaptopWifiPanel = buildLaptopWifiPanel;
            buildLaptopWifiPanel = function () {
                if (!uiState.laptop.wifiToggle) return `<div class="space-y-3 text-xs"><div class="font-extrabold text-white">إعدادات Wi-Fi</div><div class="p-3 rounded-xl bg-slate-950 text-slate-400">Wi-Fi متوقف على هذا الحاسوب.</div><button onclick="uiState.laptop.wifiToggle=true; renderActiveOS()" class="w-full py-2 rounded-lg bg-sky-600 text-white font-extrabold">تشغيل Wi-Fi</button></div>`;
                if (!networkState.wifiEnabled) return `<div class="space-y-3 text-xs"><div class="font-extrabold text-white">إعدادات Wi-Fi</div><div class="p-3 rounded-xl bg-slate-950 text-amber-300">شبكة Wi-Fi متوقفة في المودم. فعّلها من إعدادات المودم أولاً.</div><button onclick="uiState.laptop.wifiToggle=false;renderActiveOS()" class="w-full py-2 rounded-lg bg-slate-700 text-white font-bold">إيقاف Wi-Fi</button></div>`;
                const old = originalBuildLaptopWifiPanel();
                return `<div class="space-y-2"><div class="flex justify-between items-center text-xs"><b class="text-white">Wi-Fi مفعّل</b><button onclick="uiState.laptop.wifiToggle=false;networkState.laptopWifiConnected=false;syncAllUI();renderActiveOS()" class="text-rose-300">إيقاف</button></div>${old}</div>`;
            };

            connectWifiDevice = function (dev, pw) {
                if (!deviceIsOn(dev)) { showToast('شغّل الجهاز أولاً.', 'warning'); return; }
                if (dev === 'laptop' && !uiState.laptop.wifiToggle) { showToast('فعّل Wi-Fi في الحاسوب المحمول أولاً.', 'warning'); return; }
                if (dev === 'phone' && !uiState.phone.wifiToggle) { showToast('فعّل Wi-Fi في الهاتف أولاً.', 'warning'); return; }
                if (!isModemActive()) { playSound('error'); showToast('المودم مطفأ!', 'error'); return; }
                if (!networkState.wifiEnabled) { playSound('error'); showToast('شبكة Wi-Fi متوقفة في المودم.', 'error'); return; }
                if (pw !== networkState.wifiPass) { playSound('error'); showToast('كلمة مرور Wi-Fi غير صحيحة.', 'error'); return; }
                if (dev === 'laptop') { networkState.laptopWifiConnected = true; uiState.laptop.wifiOpen = false; }
                else { networkState.phoneWifiConnected = true; }
                playSound('success'); showToast(`تم الاتصال بشبكة ${networkState.ssid}.`, 'success'); syncAllUI(); renderActiveOS();
            };

            // Windows 11 desktop shell for both PCs.
            renderActiveOS = function () {
                const d = networkState.activeOS;
                if (d === 'desktop' || d === 'laptop') renderWindowsOS(d);
                else if (d === 'phone') renderPhoneOS();
            };

            renderWindowsOS = function (dev) {
                if (!deviceIsOn(dev)) { renderOffScreen(dev); return; }
                const body = document.getElementById('os-body'), st = uiState[dev], isDesk = dev === 'desktop';
                const onLAN = isDesk ? isDesktopOnLAN() : isLaptopOnLAN();
                const apps = [
                    { id: 'browser', label: 'Microsoft Edge', icon: 'fa-brands fa-edge', color: '#0ea5e9' },
                    { id: 'explorer', label: 'مستكشف الملفات', icon: 'fa-solid fa-folder', color: '#fbbf24' },
                    { id: 'notepad', label: 'المفكرة', icon: 'fa-solid fa-file-lines', color: '#38bdf8' },
                    { id: 'printers', label: 'الطابعات', icon: 'fa-solid fa-print', color: '#a78bfa' }
                ];
                if (networkState.localSendInstalled[dev]) apps.push({ id: 'localsend', label: 'LocalSend', icon: 'fa-solid fa-paper-plane', color: '#14b8a6' });
                const pending = networkState.pendingTransfers.filter(t => t.to === dev).length;
                const time = new Date().toLocaleTimeString('ar-DZ', { hour: '2-digit', minute: '2-digit' });
                const start = st.startOpen ? `<div class="win11-start absolute bottom-16 left-1/2 -translate-x-1/2 w-[min(440px,94vw)] rounded-2xl p-4 z-40 text-white"><div class="flex items-center gap-2 rounded-lg bg-slate-950/60 px-3 py-2 text-xs text-slate-400 mb-4"><i class="fa-solid fa-magnifying-glass"></i><span>اكتب هنا للبحث عن تطبيق</span></div><div class="flex justify-between text-xs font-extrabold mb-3"><span>مثبّت</span><span class="text-sky-300">كل التطبيقات</span></div><div class="grid grid-cols-4 gap-3">${apps.map(a => `<button onclick="openWinApp('${dev}','${a.id}')" class="flex flex-col items-center gap-2 p-2 rounded-xl hover:bg-white/10"><span class="w-11 h-11 rounded-xl bg-white/10 flex items-center justify-center text-xl" style="color:${a.color}"><i class="${a.icon}"></i></span><span class="text-[10px]">${a.label}</span></button>`).join('')}</div><div class="mt-4 pt-3 border-t border-white/10 flex justify-between items-center text-xs"><span>${isDesk ? 'DESKTOP-PC' : 'LAPTOP-STUDENT'}</span><button onclick="toggleDevicePower('${dev}')" class="px-3 py-1.5 rounded-lg hover:bg-rose-500/20 text-slate-300"><i class="fa-solid fa-power-off"></i> إيقاف</button></div></div>` : '';
                const wifiPanel = !isDesk && st.wifiOpen ? `<div class="absolute bottom-16 right-3 w-[min(340px,92vw)] rounded-2xl bg-slate-900/95 border border-white/15 p-4 shadow-2xl z-40">${buildLaptopWifiPanel()}</div>` : '';
                body.innerHTML = `<div class="win11-desktop w-full h-full relative overflow-hidden">
            <div class="absolute inset-0 p-5 sm:p-7 pb-24 overflow-hidden"><div class="grid grid-flow-col grid-rows-5 gap-3 w-fit">${apps.map(a => `<button onclick="openWinApp('${dev}','${a.id}')" class="w-[82px] min-h-[78px] flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/10 text-center"><span class="w-11 h-11 rounded-xl bg-slate-900/60 border border-white/10 flex items-center justify-center text-2xl shadow" style="color:${a.color}"><i class="${a.icon}"></i></span><span class="text-[10px] text-white drop-shadow font-semibold">${a.label}</span></button>`).join('')}</div>
            ${st.app ? `<div class="absolute inset-3 sm:inset-8 z-20 flex items-center justify-center">${buildWinWindowFrame(dev, st.app)}</div>` : ''}${start}${wifiPanel}</div>
            <div class="absolute bottom-0 left-0 right-0 h-[62px] flex items-center justify-center px-3"><div class="win11-taskbar rounded-2xl h-12 px-3 flex items-center gap-1.5 max-w-full">
                <button class="win11-task-icon text-sky-300" title="ابدأ" onclick="uiState['${dev}'].startOpen=!uiState['${dev}'].startOpen;renderActiveOS()"><i class="fa-brands fa-windows text-xl"></i></button>

                } else if (d.action === 'togglePrinterPower') {
                    networkState.printerPowerOn = !networkState.printerPowerOn; if (!networkState.printerPowerOn) { networkState.printerShared = false; networkState.laptopPrinterAdded = false; }
                    playSound(networkState.printerPowerOn ? 'success' : 'click'); showToast(networkState.printerPowerOn ? 'تم تشغيل الطابعة.' : 'تم إطفاء الطابعة.', networkState.printerPowerOn ? 'success' : 'warning'); syncAllUI();
                } else if (d.action === 'cableTool') selectCableTool(d.cableType); else if (d.action === 'viewPrintedPaper') openPrintedPaperModal();
            };

            updateModemLEDs3D = function () {
                if (ringMats.modem) ringMats.modem.color.setHex(isModemActive() ? 0x22c55e : 0x475569);
                if (!modemLEDs.power) return; const on = isModemActive(); const set = (m, a, c) => { m.color.setHex(a ? c : 0x334155); m.emissive.setHex(a ? c : 0x000000); };
                set(modemLEDs.power, on, 0x22c55e); set(modemLEDs.pon, on && networkState.cables.fiber, 0x22c55e); set(modemLEDs.lan1, isDesktopOnLAN(), 0x38bdf8); set(modemLEDs.wlan, on && networkState.wifiEnabled, 0x22c55e); set(modemLEDs.los, false, 0xef4444);
            };

    <script>
        (() => {

            function currentLessonTask() {
                const phases = getPhasesData();

            function requireLessonTask(code) {
