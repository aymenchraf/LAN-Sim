<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخبر الشبكة المحلية التفاعلي | LAN Lab</title>
    <!-- خطوط عربية واضحة -->
    <link href="assets/vendor/cairo.css" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="assets/vendor/tailwindcss.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="assets/vendor/fontawesome-all.min.css">
    <!-- Three.js + OrbitControls -->
    <script src="assets/vendor/three.min.js"></script>
    <script src="assets/vendor/OrbitControls.js"></script>

    <style>
        * {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0b1120;
            color: #f8fafc;
            user-select: none;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.25);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.65);
            border-radius: 10px;
        }

        .glass {
            background: rgba(15, 23, 42, 0.86);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        @keyframes slideDown {
            from {
                transform: translate(-50%, -24px);
                opacity: 0;
            }

            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }

        .toast-anim {
            animation: slideDown 0.28s ease-out forwards;
        }

        .win-wallpaper {
            background: radial-gradient(circle at 20% 20%, #1d4ed8 0%, #0f172a 55%, #020617 100%);
        }

        .win-wallpaper-laptop {
            background: radial-gradient(circle at 80% 25%, #0284c7 0%, #312e81 55%, #0f172a 100%);
        }

        .cam-btn {
            transition: all 0.2s ease;
        }

        .cam-btn:hover {
            transform: translateY(-1px);
        }

        .cam-btn.active {
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.45);
        }

        .cable-tool-btn {
            transition: all 0.2s ease;
        }

        .cable-tool-btn.selected {
            border-color: #38bdf8;
            background: rgba(14, 165, 233, 0.25);
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.45);
            transform: translateY(-3px);
        }

        .cmd-font {
            font-family: 'Consolas', 'Courier New', monospace;
        }

        #hover-tooltip {
            pointer-events: none;
            transition: opacity 0.12s ease;
        }

        @keyframes ytPulse {

            0%,
            100% {
                box-shadow: 0 0 15px rgba(239, 68, 68, 0.35);
            }

            50% {
                box-shadow: 0 0 28px rgba(239, 68, 68, 0.75);
            }
        }

        .yt-playing {
            animation: ytPulse 2s infinite;
        }

        @media print {
            body * {
                visibility: hidden;
            }

            #certificate-printable,
            #certificate-printable * {
                visibility: visible;
            }

            #certificate-printable {
                position: fixed;
                inset: 0;
                background: white !important;
                color: black !important;
                padding: 24px;
            }
        }


        /* LAN Lab refresh: calmer hierarchy, stronger readability, less HUD clutter */
        :root {
            color-scheme: dark;
        }

        body {
            background: #0f172a;
        }

        .glass {
            background: rgba(10, 18, 32, 0.94);
            border-color: rgba(148, 163, 184, 0.18);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #top-hud {
            top: 10px;
            left: 10px;
            right: 10px;
            gap: 8px;
        }

        #top-hud .cam-btn {
            padding: 8px 11px;
            font-size: 11px;
        }

        #mission-sidebar {
            width: min(420px, 94vw);
            background: rgba(8, 15, 28, 0.97);
            border-color: rgba(148, 163, 184, 0.22);
        }

        #mission-sidebar>div:first-child {
            background: rgba(15, 23, 42, 0.96);
        }

        #missions-list {
            padding: 10px 12px 22px;
        }

        #cables-toolbar {
            width: min(980px, 96vw);
            bottom: 10px;
        }

        #cables-toolbar .glass {
            background: rgba(8, 15, 28, 0.96);
        }

        #cables-toolbar>div:first-child button {
            padding: 6px 10px;
            font-size: 10px;
        }

        #guided-step-card {
            margin: 10px 12px 0;
            padding: 13px;
            border: 1px solid rgba(56, 189, 248, .35);
            border-radius: 16px;
            background: linear-gradient(145deg, rgba(14, 45, 72, .9), rgba(15, 23, 42, .96));
            box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
        }

        .lan-phase-card {
            border: 1px solid rgba(148, 163, 184, .17);
            border-radius: 15px;
            overflow: hidden;
            background: rgba(15, 23, 42, .72);
        }

        .lan-phase-card.is-current {
            border-color: rgba(56, 189, 248, .68);
            background: rgba(12, 35, 57, .86);
        }

        .lan-phase-card.is-done {
            border-color: rgba(52, 211, 153, .34);
            background: rgba(6, 45, 38, .42);
        }

        .lan-phase-head {
            width: 100%;
            padding: 11px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            text-align: right;
        }

        .lan-phase-title {
            font-size: 11px;
            line-height: 1.55;
            font-weight: 800;
            color: #f8fafc;
        }

        .lan-phase-body {
            padding: 0 11px 12px;
            border-top: 1px solid rgba(148, 163, 184, .12);
        }

        .lan-task {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 10.5px;
            line-height: 1.65;
            padding: 5px 0;
            color: #cbd5e1;
        }

        .lan-task.done {
            color: #6ee7b7;
        }

        .lan-step-list {
            margin: 7px 0;
            padding-right: 17px;
            color: #cbd5e1;
            font-size: 10.5px;
            line-height: 1.8;
            list-style: decimal;
        }

        .lan-small-label {
            color: #93c5fd;
            font-size: 10px;
            font-weight: 800;
        }

        .lan-primary-btn {
            background: #0369a1;
            color: white;
            border-radius: 10px;
            padding: 8px 11px;
            font-size: 11px;
            font-weight: 800;
        }

        .lan-primary-btn:hover {
            background: #0284c7;
        }

        .lan-secondary-btn {
            background: rgba(51, 65, 85, .8);
            color: #e2e8f0;
            border: 1px solid rgba(148, 163, 184, .18);
            border-radius: 10px;
            padding: 7px 10px;
            font-size: 10.5px;
            font-weight: 700;
        }

        .lan-activity-option {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 10px;
            border: 1px solid rgba(148, 163, 184, .16);
            border-radius: 11px;
            background: rgba(15, 23, 42, .72);
            color: #e2e8f0;
            font-size: 11px;
            line-height: 1.6;
            cursor: pointer;
        }

        .lan-activity-option:hover {
            border-color: rgba(56, 189, 248, .48);
            background: rgba(30, 41, 59, .86);
        }

        .lan-activity-option input {
            margin-top: 3px;
            accent-color: #0ea5e9;
        }

        @media (max-width: 640px) {
            #top-hud {
                left: 7px;
                right: 7px;
                top: 7px;
            }

            #top-hud>div:first-child {
                padding: 7px 9px;
            }

            #top-hud>div:nth-child(2) {
                max-width: 100%;
            }

            #top-hud .cam-btn {
                padding: 6px 8px;
                font-size: 10px;
            }

            #cables-toolbar {
                bottom: 6px;
            }

            #cables-toolbar>div:first-child button {
                padding: 5px 8px;
            }

            #mission-sidebar {
                width: min(390px, 96vw);
            }
        }
    </style>
</head>

<body>

    <!-- حاوية المشهد ثلاثي الأبعاد -->
    <div id="canvas-container"></div>

    <!-- تلميح التحويم 3D -->
    <div id="hover-tooltip"
        class="fixed z-40 hidden px-3 py-1.5 rounded-lg bg-slate-950/95 text-white text-xs font-bold border border-sky-400/60 shadow-2xl">
    </div>

    <!-- الإشعارات الفورية (Toasts) -->
    <div id="toast-container"
        class="fixed top-16 left-1/2 -translate-x-1/2 z-[120] flex flex-col gap-2 items-center pointer-events-none w-[92%] max-w-lg">
    </div>

    <!-- =================================================================== -->
    <!-- الشريط العلوي للمشهد 3D (الشعار + أزرار الكاميرا + دليل المهام)       -->
    <!-- =================================================================== -->
    <header id="top-hud"
        class="fixed top-3 left-3 right-3 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
        <!-- شعار المخبر -->
        <div class="glass rounded-2xl px-3.5 py-2 flex items-center gap-2.5 pointer-events-auto shadow-xl">
            <div
                class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center shadow">
                <i class="fa-solid fa-network-wired text-white text-base"></i>
            </div>
            <div>
                <h1 class="text-sm font-extrabold text-white leading-tight">مخبر الشبكة المحلية </h1>
                <p class="text-[10px] text-sky-300 hidden sm:block">عليك إتمام المهام بالترتيب، تأكد دوما من دليل الحصة
                </p>
            </div>
        </div>

        <!-- شريط زوايا الكاميرا في أعلى المشهد -->
        <div
            class="glass rounded-2xl p-1.5 flex items-center gap-1 overflow-x-auto max-w-full pointer-events-auto shadow-xl">
            <button onclick="setCameraPreset('overview', this)"
                class="cam-btn active px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-800/70 border border-transparent flex items-center gap-1.5">
                <i class="fa-solid fa-eye"></i> منظر عام
            </button>
            <button onclick="setCameraPreset('modemBack', this)"
                class="cam-btn px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-800/70 border border-transparent flex items-center gap-1.5 text-amber-300">
                <i class="fa-solid fa-tag"></i> خلف المودم (البطاقة والمنافذ)
            </button>
            <button onclick="setCameraPreset('pcPrinterBack', this)"
                class="cam-btn px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-800/70 border border-transparent flex items-center gap-1.5 text-sky-300">
                <i class="fa-solid fa-plug-circle-bolt"></i> خلف الحاسوب والطابعة
            </button>
            <button onclick="setCameraPreset('frontDevices', this)"
                class="cam-btn px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-800/70 border border-transparent flex items-center gap-1.5 text-emerald-300">
                <i class="fa-solid fa-desktop"></i> تفاعل مع الأجهزة
            </button>
            <button onclick="setCameraPreset('cableTable', this)"
                class="cam-btn px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-800/70 border border-transparent flex items-center gap-1.5 text-emerald-300">
                <i class="fa-solid fa-table"></i> طاولة الكابلات
            </button>
        </div>

        <!-- الصوت ودليل المهام -->
        <div class="flex items-center gap-2 pointer-events-auto">
            <button onclick="toggleSound()"
                class="glass hover:bg-slate-800 text-slate-200 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-xl"
                title="تفعيل/كتم الصوت">
                <i id="sound-icon" class="fa-solid fa-volume-high text-sky-400"></i>
            </button>
            <button onclick="toggleSidebar()"
                class="glass hover:bg-slate-800 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-2 shadow-xl border border-sky-500/40">
                <i class="fa-solid fa-list-check text-emerald-400"></i>
                <span>دليل الحصة</span>
                <span id="header-progress-badge"
                    class="bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full text-[11px]">0%</span>
            </button>
        </div>
    </header>

    <!-- شريط حالة التوصيل النشط (يظهر عند اختيار كابل) -->

        class="fixed top-20 left-1/2 -translate-x-1/2 z-20 hidden glass rounded-2xl px-4 py-2.5 border border-sky-400/60 shadow-2xl flex items-center gap-3 text-xs max-w-[92vw]">
        <i class="fa-solid fa-bezier-curve text-sky-400 text-base animate-pulse"></i>
        <span id="cabling-banner-text" class="font-bold text-white">اختر المنفذ الأول ثم المنفذ الثاني في المشهد ثلاثي
            الأبعاد</span>
        <button onclick="cancelCableSelection()"

    </div>

    <!-- =================================================================== -->
    <div id="cables-toolbar"
        class="fixed bottom-3 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center gap-2 max-w-[96vw]">
        <!-- أزرار دخول سريعة للشاشات -->
        <div class="flex items-center gap-1.5 flex-wrap justify-center">
            <button onclick="openDeviceOS('desktop')"
                class="glass hover:bg-sky-700/80 text-white px-3 py-1.5 rounded-xl text-[11px] font-bold flex items-center gap-1.5 border border-sky-400/30 transition">
                <i class="fa-solid fa-desktop text-sky-400"></i> فتح الحاسوب المكتبي
            </button>
            <button onclick="openDeviceOS('laptop')"
                class="glass hover:bg-indigo-700/80 text-white px-3 py-1.5 rounded-xl text-[11px] font-bold flex items-center gap-1.5 border border-indigo-400/30 transition">
                <i class="fa-solid fa-laptop text-indigo-400"></i> فتح المحمول
            </button>
            <button onclick="openDeviceOS('phone')"
                class="glass hover:bg-emerald-700/80 text-white px-3 py-1.5 rounded-xl text-[11px] font-bold flex items-center gap-1.5 border border-emerald-400/30 transition">
                <i class="fa-solid fa-mobile-screen text-emerald-400"></i> فتح الهاتف
            </button>
        </div>

    </div>

    <!-- ===================================================================== -->
    <!-- الشريط الجانبي البيداغوجي (10 مراحل لحصة تطبيقية)                   -->
    <!-- =================================================================== -->
    <aside id="mission-sidebar"
        class="fixed top-0 right-0 h-full w-80 sm:w-[400px] z-40 glass border-r-0 border-l border-white/15 shadow-2xl flex flex-col transition-transform duration-300 translate-x-0">
        <!-- الرأس + اسم التلميذ -->
        <div class="p-3.5 border-b border-white/10 bg-slate-900/75 space-y-2.5">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-extrabold text-white flex items-center gap-2">
                    <i class="fa-solid fa-graduation-cap text-sky-400 text-base"></i>
                    خطة العمل التطبيقي (10 مراحل)

            </div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-user-graduate text-sky-400 text-xs"></i>
                <input id="student-name-input" type="text" placeholder="أدخل اسمك ولقبك للشهادة..."

            </div>
            <!-- شريط التقدم -->
            <div>
                <div class="flex justify-between text-[11px] font-bold mb-1">

                    <span id="sidebar-progress-text" class="text-emerald-400">0%</span>

                <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                    <div id="sidebar-progress-bar"

        <!-- لوحة حالة الشبكة المصغرة -->
        <div class="px-3.5 py-2.5 bg-slate-950/70 border-b border-white/10 text-[11px]">
            <div class="grid grid-cols-2 gap-1.5 mb-1.5">

                </div>
                <div class="bg-slate-900 rounded-lg py-1 px-1 border border-white/5">
                    <div class="text-slate-400">المحمول</div>
                    <div id="mini-ip-laptop" class="font-mono font-bold text-slate-500" dir="ltr">مفصول</div>
                </div>
                <div class="bg-slate-900 rounded-lg py-1 px-1 border border-white/5">
                    <div class="text-slate-400">الهاتف</div>
                    <div id="mini-ip-phone" class="font-mono font-bold text-slate-500" dir="ltr">مفصول</div>
                </div>

    <!-- =================================================================== -->
    <!-- طبقة أنظمة التشغيل الداخلية (Virtual OS Overlay)                      -->
    <!-- =================================================================== -->
    <div id="os-overlay" class="fixed inset-0 z-30 hidden flex-col bg-slate-950">
        <div

            <div class="flex items-center gap-2.5">
                <button onclick="exitDeviceOS()"
                    class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-extrabold flex items-center gap-2 shadow transition">
                    <i class="fa-solid fa-cube"></i>
                    <span>العودة إلى المخبر ثلاثي الأبعاد</span>
                </button>
                <div id="os-active-title"
                    class="text-xs sm:text-sm font-extrabold text-sky-300 hidden sm:flex items-center gap-2"></div>
            </div>
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-xl text-[11px]">
                    <button onclick="openDeviceOS('desktop')" id="switch-desktop"
                        class="px-2.5 py-1 rounded-lg transition">المكتبي</button>
                    <button onclick="openDeviceOS('laptop')" id="switch-laptop"
                        class="px-2.5 py-1 rounded-lg transition">المحمول</button>
                    <button onclick="openDeviceOS('phone')" id="switch-phone"

                </div>
                <button onclick="toggleSidebar()"

    <!-- =================================================================== -->
    <!-- نافذة الاختبار الختامي والشهادة + نافذة معاينة الورقة المطبوعة         -->
    <!-- =================================================================== -->
    <div id="modal-overlay"
        class="fixed inset-0 z-[90] hidden bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
        <div id="modal-content"
            class="w-full max-w-2xl bg-slate-900 border border-sky-400/40 rounded-3xl shadow-2xl overflow-hidden my-auto max-h-[92vh] flex flex-col">
        </div>
    </div>

    <script>
        // =========================================================================
        // 1. محرك الصوت (Web Audio API)
        // =========================================================================
        let soundEnabled = true;
        let audioCtx = null;

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) audioCtx = new AC();
                }
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                if (!audioCtx) return;

                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(580, now);
                    osc.frequency.exponentialRampToValueAtTime(320, now + 0.05);
                    gain.gain.setValueAtTime(0.07, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'plug') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(240, now);
                    osc.frequency.exponentialRampToValueAtTime(560, now + 0.12);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
                    osc.start(now); osc.stop(now + 0.13);
                } else if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.09, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
                    osc.start(now); osc.stop(now + 0.32);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(190, now);
                    osc.frequency.linearRampToValueAtTime(125, now + 0.18);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'print') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(135, now);
                    osc.frequency.linearRampToValueAtTime(195, now + 0.45);
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now); osc.stop(now + 0.5);
                }
            } catch (e) { }
        }

            const box = document.getElementById('toast-container');

            const styles = {

                error: 'bg-rose-600/95 border-rose-300/50 text-white',
                warning: 'bg-amber-600/95 border-amber-300/50 text-white',
                info: 'bg-slate-900/95 border-sky-400/50 text-sky-100'
            };
            const icons = {
                success: 'fa-circle-check',
                error: 'fa-circle-xmark',
                warning: 'fa-triangle-exclamation',
                info: 'fa-circle-info'
            };
            el.className = `toast-anim px-4 py-2.5 rounded-xl border shadow-2xl text-xs sm:text-sm font-bold flex items-center gap-2.5 pointer-events-auto ${styles[type] || styles.info}`;
            el.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-base shrink-0"></i><span>${msg}</span>`;
            box.appendChild(el);

                setTimeout(() => el.remove(), 300);

        function selectCableTool(cableType) {
            playSound('click');
            // إذا كان الكابل موصلاً بالفعل نسمح بفصله بنقرة تأكيدية بسيطة
            if (networkState.cables[cableType]) {
                disconnectCable(cableType);
                return;
            }
            if (selectedCableType === cableType) {
                cancelCableSelection();
                return;
            }
            selectedCableType = cableType;
            selectedFirstPortId = null;

            // توجيه الكاميرا تلقائياً للزاوية الأنسب لتسهيل العمل على التلميذ
            if (cableType === 'fiber' || cableType === 'power') {
                setCameraPreset('modemBack', document.querySelectorAll('.cam-btn')[1]);
            } else if (cableType === 'rj45' || cableType === 'usb') {
                setCameraPreset('pcPrinterBack', document.querySelectorAll('.cam-btn')[2]);
            }

            updateCableToolbarUI();
            const banner = document.getElementById('cabling-banner');
            document.getElementById('cabling-banner-text').textContent = `${CABLE_RULES[cableType].label}: ${CABLE_RULES[cableType].hint}`;
            banner.classList.remove('hidden');
            highlightValidPorts();
        }

        function cancelCableSelection() {
            selectedCableType = null;
            selectedFirstPortId = null;
            document.getElementById('cabling-banner').classList.add('hidden');
            updateCableToolbarUI();
            highlightValidPorts();
        }

        function disconnectCable(cableType) {
            networkState.cables[cableType] = false;
            if (cableType === 'power') {
                networkState.modemPowerOn = false;
                networkState.laptopWifiConnected = false;
                networkState.phoneWifiConnected = false;
            }
            if (cableType === 'usb') {
                networkState.printerShared = false;
                networkState.laptopPrinterAdded = false;
            }
            disposeCable(cableType);
            showToast(`تم فصل ${CABLE_RULES[cableType].label}.`, 'warning');
            syncAllUI();
        }

        function handlePortClick(portId, portLabel) {
            if (!selectedCableType) {
                showToast(`هذا هو ${portLabel}. اختر الكابل المناسب من طاولة الكابلات على يمين المكتب أولاً!`, 'info');
                playSound('click');
                return;
            }

            const rule = CABLE_RULES[selectedCableType];
            // التحقق هل المنفذ مناسب لهذا الكابل
            if (!rule.validPorts.includes(portId)) {
                playSound('error');
                showToast(`خطأ في التوصيل! لا يمكن إدخال ${rule.label} في ${portLabel}!`, 'error');
                return;
            }

            if (!selectedFirstPortId) {
                selectedFirstPortId = portId;
                playSound('click');
                document.getElementById('cabling-banner-text').textContent = `تم تثبيت الطرف الأول في (${portLabel}) — الآن انقر على المنفذ المقابل لإكمال التوصيل!`;
                highlightValidPorts();
                return;
            }

            if (selectedFirstPortId === portId) {
                showToast('اختر المنفذ المقابل في الجهاز الآخر!', 'warning');
                return;
            }

            // منع توصيل LAN1 بـ LAN2 في نفس المودم
            if (selectedCableType === 'rj45' && selectedFirstPortId.startsWith('modem_lan') && portId.startsWith('modem_lan')) {
                playSound('error');
                showToast('لا يمكن توصيل منفذ LAN بمنفذ LAN آخر في نفس المودم! وصّله بمنفذ RJ45 في الحاسوب المكتبي.', 'error');
                return;
            }

            // التوصيل صحيح!
            if (selectedCableType === 'rj45') {
                networkState.cables.rj45Port = selectedFirstPortId.startsWith('modem_lan') ? selectedFirstPortId : portId;
            }
            networkState.cables[selectedCableType] = true;
            createPhysical3DCable(selectedCableType, selectedFirstPortId, portId);
            playSound('success');
            showToast(`أحسنت! تم توصيل ${rule.label} بنجاح بين المنفذين.`, 'success');

            cancelCableSelection();
            syncAllUI();
        }

        // =========================================================================
        // مكتبة النمذجة الواقعية: حواف مدورة، منافذ حقيقية، رؤوس كابلات، أزرار، طاولة الكابلات
        // =========================================================================
        const MAT = {
            metal: new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.95, roughness: 0.28 }),
            gold: new THREE.MeshStandardMaterial({ color: 0xd4a017, metalness: 1, roughness: 0.25 }),
            dark: new THREE.MeshStandardMaterial({ color: 0x05070b, roughness: 0.9 }),
            black: new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.55 })
        };
        const ringMats = {};
        const std = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.5 }, o || {}));
        const mk = (geo, mat, parent, x, y, z) => {
            const m = new THREE.Mesh(geo, mat);
            m.position.set(x || 0, y || 0, z || 0);
            if (parent) parent.add(m);
            return m;
        };
        const bx = (w, h, d, mat, parent, x, y, z) => mk(new THREE.BoxGeometry(w, h, d), mat, parent, x, y, z);
        // أسطوانة محورها Z (القاعدة الصغرى rTop نحو +Z)
        const cz = (rTop, rBot, len, mat, parent, x, y, z) => {
            const m = mk(new THREE.CylinderGeometry(rTop, rBot, len, 18), mat, parent, x, y, z);
            m.rotation.x = Math.PI / 2;
            return m;
        };

        function RBoxGeo(w, h, d, r) {
            const b = Math.min(r * 0.5, 0.02), W = w - 2 * b, H = h - 2 * b, R = Math.max(r - b, 0.005), x = -W / 2, y = -H / 2;
            const s = new THREE.Shape();
            s.moveTo(x + R, y); s.lineTo(x + W - R, y); s.quadraticCurveTo(x + W, y, x + W, y + R);
            s.lineTo(x + W, y + H - R); s.quadraticCurveTo(x + W, y + H, x + W - R, y + H);
            s.lineTo(x + R, y + H); s.quadraticCurveTo(x, y + H, x, y + H - R);
            s.lineTo(x, y + R); s.quadraticCurveTo(x, y, x + R, y);
            const g = new THREE.ExtrudeGeometry(s, { depth: d - 2 * b, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 2, curveSegments: 6 });
            g.translate(0, 0, -(d - 2 * b) / 2);
            return g;
        }

        const rectPts = (w, h) => [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]];
        // إطار بثقب: outer = [w,h] أو نصف قطر، holes = قوائم نقاط أو نصف قطر. يمتد من z=0 إلى z=depth
        function frameGeo(outer, holes, depth) {
            const s = new THREE.Shape();
            if (typeof outer === 'number') s.absarc(0, 0, outer, 0, Math.PI * 2, false);
            else { const p = rectPts(outer[0], outer[1]); s.moveTo(...p[0]); p.slice(1).forEach(q => s.lineTo(...q)); s.lineTo(...p[0]); }
            holes.forEach(hp => {
                const p = new THREE.Path();
                if (typeof hp === 'number') p.absarc(0, 0, hp, 0, Math.PI * 2, true);
                else { p.moveTo(...hp[0]); hp.slice(1).forEach(q => p.lineTo(...q)); p.lineTo(...hp[0]); }
                s.holes.push(p);
            });
            return new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: 24 });
        }
        function polyGeo(pts, depth) {
            const s = new THREE.Shape();
            s.moveTo(...pts[0]); pts.slice(1).forEach(q => s.lineTo(...q)); s.lineTo(...pts[0]);
            return new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false });
        }

        // ---------- المنافذ (الواجهة نحو +Z، سطح الجهاز عند z=0) ----------
        const USB_B_HOLE = [[-0.04, -0.04], [0.04, -0.04], [0.04, 0.022], [0.026, 0.04], [-0.026, 0.04], [-0.04, 0.022]];
        const PORTS = {

                mk(frameGeo([0.17, 0.15], [rectPts(0.15, 0.13)], 0.012), std(col, { roughness: 0.4 }), g);
                mk(frameGeo([0.15, 0.13], [hole], 0.03), MAT.metal, g);
                bx(0.15, 0.13, 0.002, MAT.dark, g, 0, 0, 0.002);
                for (let i = 0; i < 8; i++) bx(0.0045, 0.004, 0.03, MAT.gold, g, -0.0315 + i * 0.009, 0.036, 0.016);
                return [0.17, 0.15];
            },
            usbA(g) {
                mk(frameGeo([0.15, 0.07], [rectPts(0.122, 0.05)], 0.028), MAT.metal, g);
                bx(0.15, 0.07, 0.002, MAT.dark, g, 0, 0, 0.002);
                bx(0.108, 0.012, 0.026, std(0x2563eb, { roughness: 0.4 }), g, 0, -0.006, 0.014);
                for (let i = 0; i < 4; i++) bx(0.012, 0.002, 0.016, MAT.gold, g, -0.034 + i * 0.0227, 0.001, 0.018);
                return [0.15, 0.07];
            },
            usbB(g) {
                mk(frameGeo([0.12, 0.12], [USB_B_HOLE], 0.03), MAT.metal, g);
                bx(0.12, 0.12, 0.002, MAT.dark, g, 0, 0, 0.002);
                bx(0.05, 0.01, 0.02, std(0xf1f5f9), g, 0, -0.004, 0.012);
                return [0.12, 0.12];
            },
            dc(g) {
                mk(frameGeo(0.055, [0.034], 0.034), std(0x0b0f14, { roughness: 0.6 }), g);
                mk(new THREE.CircleGeometry(0.034, 24), MAT.dark, g, 0, 0, 0.002);
                cz(0.009, 0.009, 0.032, MAT.metal, g, 0, 0, 0.016);
                return [0.11, 0.11];
            },
            sc(g, col) {
                const gr = std(col, { roughness: 0.35 });
                mk(frameGeo([0.11, 0.085], [rectPts(0.052, 0.052)], 0.03), gr, g);
                bx(0.012, 0.03, 0.02, gr, g, -0.06, 0, 0.01);
                bx(0.012, 0.03, 0.02, gr, g, 0.06, 0, 0.01);
                mk(new THREE.CircleGeometry(0.026, 4), MAT.dark, g, 0, 0, 0.002).rotation.z = Math.PI / 4;
                cz(0.014, 0.014, 0.02, std(0xf8fafc, { roughness: 0.3 }), g, 0, 0, 0.012);
                mk(new THREE.CircleGeometry(0.006, 12), MAT.dark, g, 0, 0, 0.0225);
                return [0.11, 0.085];
            },
            eu(g) {
                const w = std(0xf1f5f9, { roughness: 0.4 });
                mk(frameGeo(0.1, [0.078], 0.016), w, g);
                mk(new THREE.CircleGeometry(0.078, 28), std(0xe5e7eb), g, 0, 0, 0.002);
                [-0.0225, 0.0225].forEach(x => mk(new THREE.CircleGeometry(0.0125, 14), MAT.dark, g, x, 0, 0.003));
                [-0.072, 0.072].forEach(y => bx(0.04, 0.012, 0.014, MAT.metal, g, 0, y, 0.008));
                return [0.2, 0.2];
            }
        };

        function addPort(parent, type, col, x, y, z, rx, ry, id, label) {
            const fr = new THREE.Group();
            fr.position.set(x, y, z);
            fr.rotation.set(rx, ry, 0);
            parent.add(fr);
            const dim = PORTS[type](fr, col);
            if (!id) return fr; // منفذ تزييني غير تفاعلي
            const hit = new THREE.Mesh(
                new THREE.BoxGeometry(dim[0] + 0.03, dim[1] + 0.03, 0.08),
                new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending })
            );
            hit.position.z = 0.02;
            hit.userData = { action: 'port', portId: id, tooltip: label, frame: fr };
            fr.add(hit);
            portMeshes[id] = hit;
            interactiveObjects.push(hit);
            return fr;
        }

        // ---------- رؤوس الكابلات (الطرف عند الأصل ويتجه نحو -Z، والكابل يخرج نحو +Z) ----------
        function buildPlug(type, portId) {
            const g = new THREE.Group();
            const cm = std(CABLE_RULES[type].color, { roughness: 0.45 });
            const boot = (r1, r2, len, z, mat) => cz(r2, r1, len, mat, g, 0, 0, z + len / 2);
            let exit;
            if (type === 'fiber') { // موصل SC/APC أخضر
                const gr = std(0x22c55e, { roughness: 0.35 });
                bx(0.048, 0.048, 0.04, gr, g, 0, 0, 0.02);
                bx(0.064, 0.062, 0.09, gr, g, 0, 0, 0.075);
                bx(0.03, 0.01, 0.04, std(0x15803d), g, 0, 0.035, 0.06);
                cz(0.012, 0.012, 0.05, std(0xf8fafc, { roughness: 0.3 }), g, 0, 0, 0);
                boot(0.022, 0.011, 0.08, 0.12, cm);
                exit = 0.2;
            } else if (type === 'rj45') { // رأس RJ45 شفاف بنقاط تلامس ذهبية
                const clear = std(0xe5e7eb, { transparent: true, opacity: 0.78, roughness: 0.12 });
                bx(0.108, 0.07, 0.12, clear, g, 0, 0, 0.06);
                for (let i = 0; i < 8; i++) bx(0.0045, 0.003, 0.045, MAT.gold, g, -0.0315 + i * 0.009, 0.0355, 0.032);
                const latch = bx(0.04, 0.01, 0.075, clear, g, 0, -0.04, 0.085);
                latch.rotation.x = -0.12;
                bx(0.09, 0.064, 0.06, cm, g, 0, 0, 0.15);
                boot(0.032, 0.014, 0.08, 0.18, cm);
                exit = 0.26;
            } else if (type === 'usb') {
                if (portId === 'printer_usb') { // USB-B
                    const sh = mk(polyGeo(USB_B_HOLE.map(p => [p[0] * 0.9, p[1] * 0.9]), 0.09), MAT.metal, g);
                    bx(0.09, 0.09, 0.09, MAT.black, g, 0, 0, 0.135);
                    boot(0.04, 0.014, 0.07, 0.18, MAT.black);
                    exit = 0.25;
                } else { // USB-A
                    bx(0.118, 0.046, 0.1, MAT.metal, g, 0, 0, 0.05);
                    bx(0.1, 0.056, 0.09, MAT.black, g, 0, 0, 0.145);
                    boot(0.032, 0.012, 0.07, 0.19, MAT.black);
                    exit = 0.26;
                }
            } else if (portId === 'power_strip') { // محول بقابس أوروبي
                const w = std(0xf1f5f9, { roughness: 0.4 });
                [-0.0225, 0.0225].forEach(x => cz(0.0115, 0.0115, 0.05, MAT.metal, g, x, 0, 0));
                cz(0.07, 0.07, 0.05, w, g, 0, 0, 0.041);
                mk(RBoxGeo(0.14, 0.1, 0.16, 0.02), std(0xe2e8f0, { roughness: 0.45 }), g, 0, 0, 0.146);
                bx(0.1, 0.002, 0.08, MAT.dark, g, 0, 0.051, 0.15);
                boot(0.022, 0.0125, 0.05, 0.226, MAT.black);
                exit = 0.276;
            } else { // قابس DC أسطواني
                cz(0.026, 0.026, 0.045, MAT.metal, g, 0, 0, 0.0225);
                cz(0.033, 0.033, 0.07, MAT.black, g, 0, 0, 0.075);
                boot(0.033, 0.012, 0.06, 0.11, MAT.black);
                exit = 0.17;
            }
            g.traverse(o => { if (o.isMesh) o.castShadow = true; });
            g.userData.exit = exit;
            return g;
        }

        function disposeCable(type) {
            const o = cableMeshes3D[type];
            if (!o) return;
            scene.remove(o);
            o.traverse(m => { if (m.geometry) m.geometry.dispose(); });
            delete cableMeshes3D[type];
        }

        function createPhysical3DCable(cableType, portAId, portBId) {
            disposeCable(cableType);
            const grp = new THREE.Group();
            const ends = [portAId, portBId].map(id => {
                const fr = portMeshes[id].userData.frame;
                const p = new THREE.Vector3(), q = new THREE.Quaternion();
                fr.getWorldPosition(p); fr.getWorldQuaternion(q);
                const n = new THREE.Vector3(0, 0, 1).applyQuaternion(q);
                const plug = buildPlug(cableType, id);
                plug.position.copy(p); plug.quaternion.copy(q);
                grp.add(plug);
                const e0 = p.clone().addScaledVector(n, plug.userData.exit);
                return { e0, e1: e0.clone().addScaledVector(n, 0.28) };
            });
            const onDesk = v => v.z > -1.45 && Math.abs(v.x) < 4.7;
            const fix = v => { v.y = Math.max(v.y, onDesk(v) ? 1.1 : 0.4); return v; };
            const [A, B] = ends;
            const mid = A.e1.clone().lerp(B.e1, 0.5);
            mid.y = Math.min(A.e1.y, B.e1.y) - 0.15;
            const curve = new THREE.CatmullRomCurve3([A.e0, fix(A.e1), fix(mid), fix(B.e1), B.e0]);
            const rule = CABLE_RULES[cableType];
            const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 90, rule.radius, 10, false), std(rule.color, { roughness: 0.45 }));
            tube.castShadow = true;
            grp.add(tube);
            scene.add(grp);
            cableMeshes3D[cableType] = grp;
        }

        function buildSideTable3D() {
            const T = new THREE.Group();
            T.position.set(2.3, 0, 3.7);
            scene.add(T);
            const wood = std(0xffffff, { roughness: 0.5 });
            wood.map = createWoodTexture();

            top.castShadow = top.receiveShadow = true;
            const shelf = bx(1.8, 0.04, 1.1, wood, T, 0, 0.3, 0);
            shelf.castShadow = shelf.receiveShadow = true;
            [[-0.9, -0.55], [0.9, -0.55], [-0.9, 0.55], [0.9, 0.55]].forEach(p => {
                const leg = mk(new THREE.CylinderGeometry(0.03, 0.022, 0.93, 12), std(0x0f172a, { metalness: 0.7, roughness: 0.35 }), T, p[0], 0.465, p[1]);
                leg.castShadow = true;
            });
            const names = { fiber: 'كابل الألياف (SC/APC)', power: 'محول الطاقة 12V', rj45: 'كابل الشبكة RJ45', usb: 'كابل الطابعة USB' };
            const ends = { fiber: ['pto', 'modem_pon'], power: ['power_strip', 'modem_dc'], rj45: ['modem_lan1', 'pc_rj45'], usb: ['pc_usb', 'printer_usb'] };
            ['fiber', 'power', 'rj45', 'usb'].forEach((type, i) => {
                const rule = CABLE_RULES[type];
                const g = new THREE.Group();
                g.position.set(i % 2 ? 0.48 : -0.48, 0.965, i < 2 ? -0.3 : 0.3);
                T.add(g);
                const body = new THREE.Group();
                g.add(body);
                const plugs = ends[type].map((id, k) => {
                    const p = buildPlug(type, id);
                    const ex = p.userData.exit;
                    p.rotation.y = k ? -Math.PI / 2 : Math.PI / 2;
                    p.position.set(k ? ex + 0.1 : -(ex + 0.1), 0.06, 0);
                    body.add(p);
                    return p;
                });
                const V = THREE.Vector3, pts = [new V(-0.1, 0.06, 0)], turns = 2.6, n = Math.round(turns * 10);
                for (let k = 0; k <= n; k++) {
                    const a = Math.PI + (k / 10) * 2 * Math.PI, R = 0.088 - 0.012 * (k / n);
                    pts.push(new V(Math.cos(a) * R, 0.022 + (k / n) * 0.1, Math.sin(a) * R));
                }
                pts.push(new V(0.1, 0.06, 0));
                const coil = mk(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 220, rule.radius, 10, false), std(rule.color, { roughness: 0.45 }), body);
                coil.castShadow = true;
                const glow = mk(new THREE.PlaneGeometry(0.9, 0.52), new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.28, depthWrite: false }), g, 0, 0.003, 0);
                glow.rotation.x = -Math.PI / 2;
                glow.visible = false;
                const label = mk(new THREE.PlaneGeometry(0.62, 0.155), new THREE.MeshBasicMaterial({ map: labelTex(names[type], false, false) }), g, 0, 0.004, 0.2);
                label.rotation.x = -Math.PI / 2;
                const hit = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.22, 0.5), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
                hit.position.y = 0.09;
                hit.userData = { action: 'cableTool', cableType: type, tooltip: names[type] };
                g.add(hit);
                interactiveObjects.push(hit);
                tableCables[type] = { body, glow, label, hit, name: names[type], key: '00' };
            });
            updateTableCables();
        }

        function setCameraPreset(presetName, btnEl) {
            const p = CAMERA_PRESETS[presetName];
            if (!p) return;
            playSound('click');
            camTargetPos = p.pos.clone();
            camTargetLook = p.look.clone();

            if (presetName === 'modemBack' && !networkState.inspectedModemBack) {
                networkState.inspectedModemBack = true;
                showToast('رائع! يمكنك الآن قراءة بيانات بطاقة المودم (admin / Fiber@2026) وتوصيل المنافذ الخلفية.', 'info');

            document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));

        function handle3DClick(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(interactiveObjects, false);
            if (!hits.length) return;

            const d = hits[0].object.userData;
            if (d.action === 'port') {
                handlePortClick(d.portId, d.tooltip);
            } else if (d.action === 'os') {
                playSound('click');
                openDeviceOS(d.device);
            } else if (d.action === 'inspectSticker') {
                networkState.inspectedModemBack = true;
                playSound('success');
                showToast('بيانات البطاقة: IP = 192.168.1.1 | User = admin | Pass = Fiber@2026', 'info');
                syncAllUI();
            } else if (d.action === 'toggleModemPower') {
                if (!networkState.cables.power) {
                    playSound('error');
                    showToast('لا يمكن تشغيل المودم! قم بتوصيل محول الطاقة (DC 12V) بالمقبس الكهربائي أولاً.', 'error');
                    return;
                }
                networkState.modemPowerOn = !networkState.modemPowerOn;
                if (!networkState.modemPowerOn) {
                    networkState.laptopWifiConnected = false;
                    networkState.phoneWifiConnected = false;
                }
                playSound(networkState.modemPowerOn ? 'success' : 'click');
                showToast(networkState.modemPowerOn
                    ? (networkState.cables.fiber ? 'تم تشغيل المودم بنجاح! إشارة الألياف البصرية (PON) خضراء وثابتة.' : 'تم تشغيل المودم، لكن مصباح LOS يومض بالأحمر لأن كابل الألياف غير متصل!')
                    : 'تم إطفاء المودم.', networkState.modemPowerOn ? 'success' : 'warning');
                syncAllUI();
            } else if (d.action === 'togglePrinterPower') {
                networkState.printerPowerOn = !networkState.printerPowerOn;
                if (!networkState.printerPowerOn) {
                    networkState.printerShared = false;
                    networkState.laptopPrinterAdded = false;
                }
                playSound(networkState.printerPowerOn ? 'success' : 'click');
                showToast(networkState.printerPowerOn ? 'تم تشغيل الطابعة بنجاح! المصباح الأخضر يعمل.' : 'تم إطفاء الطابعة.', networkState.printerPowerOn ? 'success' : 'warning');
                syncAllUI();
            } else if (d.action === 'cableTool') {
                selectCableTool(d.cableType);
            } else if (d.action === 'viewPrintedPaper') {
                openPrintedPaperModal();
            }
        }

        function handle3DHover(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(interactiveObjects, false);
            const tip = document.getElementById('hover-tooltip');
            if (hits.length && hits[0].object.userData.tooltip) {
                renderer.domElement.style.cursor = 'pointer';
                tip.textContent = hits[0].object.userData.tooltip;
                tip.style.left = (e.clientX + 14) + 'px';
                tip.style.top = (e.clientY - 30) + 'px';
                tip.classList.remove('hidden');
            } else {
                renderer.domElement.style.cursor = 'grab';
                tip.classList.add('hidden');
            }
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);

            if (camTargetPos && camTargetLook) {
                camera.position.lerp(camTargetPos, 0.085);
                controls.target.lerp(camTargetLook, 0.085);
                if (camera.position.distanceTo(camTargetPos) < 0.04) {
                    camTargetPos = null; camTargetLook = null;
                }
            }

            // وميض مصباح LOS الأحمر إذا كان المودم يعمل بدون ألياف بصرية
            if (modemLEDs.los && isModemActive() && !networkState.cables.fiber) {
                losBlinkTimer += 0.07;
                const on = Math.sin(losBlinkTimer * 3) > 0;
                modemLEDs.los.color.setHex(on ? 0xef4444 : 0x334155);
                modemLEDs.los.emissive.setHex(on ? 0xef4444 : 0x000000);
            }

            // حركة خروج الورقة من الطابعة
            if (paperAnimProgress >= 0 && paperAnimProgress < 1 && printerPaperMesh) {
                paperAnimProgress += 0.014;
                printerPaperMesh.position.z = 0.14 + paperAnimProgress * 0.68;
                if (paperAnimProgress >= 1) paperAnimProgress = 1;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // نظام Windows المحاكي (للحاسوب المكتبي والمحمول)
        // -------------------------------------------------------------------------
        function renderWindowsOS(dev) {
            const body = document.getElementById('os-body');
            const st = uiState[dev];
            const isDesk = dev === 'desktop';
            const onLAN = isDesk ? isDesktopOnLAN() : isLaptopOnLAN();
            const ip = isDesk ? '192.168.1.2' : '192.168.1.3';
            const pendingCount = networkState.pendingTransfers.filter(t => t.to === dev).length;

            const icons = [
                { id: 'notepad', label: 'المفكرة (Notepad)', icon: 'fa-file-pen', grad: 'from-sky-400 to-cyan-600' },
                { id: 'explorer', label: 'مستكشف الملفات', icon: 'fa-folder-open', grad: 'from-amber-400 to-orange-500' },
                { id: 'browser', label: 'المتصفح', icon: 'fa-globe', grad: 'from-blue-500 to-indigo-600' },
                { id: 'cmd', label: 'موجه الأوامر CMD', icon: 'fa-terminal', grad: 'from-slate-600 to-slate-800' },
                { id: 'printers', label: 'الطابعات', icon: 'fa-print', grad: 'from-violet-500 to-purple-700' }
            ];
            if (networkState.localSendInstalled[dev]) {
                icons.push({ id: 'localsend', label: 'LocalSend', icon: 'fa-paper-plane', grad: 'from-teal-400 to-emerald-600', badge: pendingCount });
            }

            const customDesktopFiles = networkState.fs[dev].desktop.filter(f => f.custom);

            body.innerHTML = `
            <div class="w-full h-full ${isDesk ? 'win-wallpaper' : 'win-wallpaper-laptop'} flex flex-col justify-between overflow-hidden">
                <div class="flex-1 relative p-4 sm:p-5 overflow-hidden">
                    <!-- أيقونات سطح المكتب -->
                    <div class="grid grid-flow-col grid-rows-5 gap-3 w-fit">
                        ${icons.map(ic => `
                            <button onclick="openWinApp('${dev}', '${ic.id}')" class="w-24 flex flex-col items-center gap-1 p-2 rounded-xl hover:bg-white/15 transition text-center group relative">
                                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${ic.grad} flex items-center justify-center shadow-lg group-hover:scale-105 transition">
                                    <i class="fa-solid ${ic.icon} text-white text-xl"></i>
                                </div>
                                ${ic.badge ? `<span class="absolute top-1 right-3 bg-rose-500 text-white text-[10px] font-bold px-1.5 rounded-full animate-bounce">${ic.badge}</span>` : ''}
                                <span class="text-[11px] font-bold text-white drop-shadow leading-tight">${ic.label}</span>
                            </button>
                        `).join('')}

                        ${customDesktopFiles.map(f => `
                            <button onclick="openFileInNotepad('${dev}', '${f.id}', 'desktop')" class="w-24 flex flex-col items-center gap-1 p-2 rounded-xl hover:bg-white/15 transition text-center group">
                                <div class="w-12 h-12 rounded-2xl bg-white/90 flex items-center justify-center shadow-lg group-hover:scale-105 transition">
                                    <i class="fa-solid fa-file-lines text-sky-600 text-2xl"></i>
                                </div>
                                <span class="text-[10px] font-bold text-white drop-shadow truncate w-full">${f.name}</span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- نافذة التطبيق المفتوح -->
                    <div id="win-host-${dev}" class="absolute inset-2 sm:inset-5 pointer-events-none flex items-center justify-center z-20">
                        ${st.app ? buildWinWindowFrame(dev, st.app) : ''}
                    </div>

                    <!-- قائمة ابدأ (Start Menu) -->
                    ${st.startOpen ? `
                        <div class="absolute bottom-2 right-3 w-64 bg-slate-900/95 border border-white/15 rounded-2xl p-3 shadow-2xl z-30 space-y-1.5">
                            <div class="text-xs font-extrabold text-sky-300 px-2 pb-1.5 border-b border-white/10">قائمة ابدأ • ${isDesk ? 'DESKTOP-PC' : 'LAPTOP'}</div>
                            ${icons.map(ic => `
                                <button onclick="uiState['${dev}'].startOpen=false; openWinApp('${dev}','${ic.id}')" class="w-full flex items-center gap-2.5 px-2.5 py-2 rounded-xl hover:bg-slate-800 text-xs font-bold text-white text-right">
                                    <i class="fa-solid ${ic.icon} text-sky-400 w-4"></i><span>${ic.label}</span>
                                </button>
                            `).join('')}
                        </div>
                    ` : ''}

                    <!-- نافذة Wi-Fi للابتوب -->
                    ${!isDesk && st.wifiOpen ? `
                        <div class="absolute bottom-2 left-3 w-80 bg-slate-900/95 border border-sky-400/50 rounded-2xl p-4 shadow-2xl z-30">
                            ${buildLaptopWifiPanel()}
                        </div>
                    ` : ''}
                </div>

                <!-- شريط المهام (Taskbar) -->
                <div class="h-11 bg-slate-950/92 border-t border-white/15 px-3 flex items-center justify-between text-xs shrink-0 z-30">
                    <div class="flex items-center gap-2">
                        <button onclick="uiState['${dev}'].startOpen = !uiState['${dev}'].startOpen; renderActiveOS()" class="w-8 h-8 rounded-lg bg-sky-600/30 hover:bg-sky-600/50 border border-sky-400/40 flex items-center justify-center text-sky-400">
                            <i class="fa-brands fa-windows text-base"></i>
                        </button>
                        <span class="font-bold text-slate-300 hidden sm:inline">${isDesk ? 'DESKTOP-PC' : 'LAPTOP-STUDENT'}</span>
                        ${st.app ? `<span class="px-2.5 py-1 rounded-lg bg-slate-800 text-sky-300 text-[11px] font-bold border border-sky-500/30">${getAppArabicTitle(st.app)}</span>` : ''}
                    </div>
                    <div class="flex items-center gap-2.5">
                        ${isDesk ? `
                            <div class="flex items-center gap-2 px-2.5 py-1 rounded-lg bg-slate-900 border border-white/10" title="${onLAN ? 'IPv4: ' + ip : 'غير متصل'}">
                                <i class="fa-solid fa-ethernet ${onLAN ? 'text-emerald-400' : 'text-rose-400'}"></i>
                                <span class="text-[11px] font-bold ${onLAN ? 'text-emerald-300' : 'text-rose-300'}">${onLAN ? (hasInternet() ? `متصل • ${ip}` : `شبكة محلية • ${ip}`) : 'كابل RJ45 مفصول'}</span>
                            </div>
                        ` : `
                            <button onclick="uiState.laptop.wifiOpen = !uiState.laptop.wifiOpen; renderActiveOS()" class="flex items-center gap-2 px-3 py-1 rounded-lg border font-bold text-[11px] ${onLAN ? 'bg-emerald-950/70 border-emerald-400/50 text-emerald-300' : 'bg-amber-950/60 border-amber-400/60 text-amber-200 animate-pulse'}">
                                <i class="fa-solid fa-wifi"></i>
                                <span>${onLAN ? `${networkState.ssid} (${ip})` : 'Wi-Fi غير متصل (انقر)'}</span>
                            </button>
                        `}
                        <span class="text-slate-300 font-mono text-[11px]">10:30</span>
                    </div>
                </div>
            </div>
        `;
        }

        function getAppArabicTitle(app) {
            return { notepad: 'المفكرة (Notepad)', explorer: 'مستكشف الملفات', browser: 'متصفح الويب', cmd: 'موجه الأوامر (CMD)', printers: 'لوحة التحكم • الطابعات', localsend: 'تطبيق LocalSend' }[app] || app;
        }

        function openWinApp(dev, app) {
            playSound('click');
            uiState[dev].app = app;
            uiState[dev].startOpen = false;
            if (dev === 'laptop') uiState.laptop.wifiOpen = false;
            renderActiveOS();
        }

        function closeWinApp(dev) {
            playSound('click');
            uiState[dev].app = null;
            renderActiveOS();
        }

        function buildWinWindowFrame(dev, app) {
            let inner = '';
            if (app === 'notepad') inner = buildNotepadUI(dev);
            else if (app === 'explorer') inner = buildExplorerUI(dev);
            else if (app === 'browser') inner = buildBrowserUI(dev);
            else if (app === 'cmd') inner = buildCmdUI(dev);
            else if (app === 'printers') inner = buildPrintersUI(dev);
            else if (app === 'localsend') inner = buildLocalSendUI(dev);

            return `
            <div class="pointer-events-auto w-full max-w-4xl h-full max-h-[86vh] bg-slate-900 rounded-2xl border border-white/20 shadow-2xl flex flex-col overflow-hidden">
                <div class="h-10 bg-slate-800 px-4 flex items-center justify-between border-b border-white/10 shrink-0">
                    <span class="text-xs sm:text-sm font-extrabold text-white">${getAppArabicTitle(app)}</span>
                    <button onclick="closeWinApp('${dev}')" class="w-7 h-7 rounded-lg bg-rose-500/20 hover:bg-rose-600 text-rose-300 hover:text-white flex items-center justify-center transition">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="flex-1 overflow-y-auto p-4 bg-slate-950/65">${inner}</div>
            </div>
        `;
        }

        // -------------------------------------------------------------------------
        // تطبيق المفكرة (Notepad) — إنشاء ملفات مخصصة + طباعة مباشرة
        // -------------------------------------------------------------------------
        let notepadDraft = { desktop: { name: 'ملفي_الأول.txt', content: '', loc: 'desktop' }, laptop: { name: 'وثيقة_للطباعة.txt', content: '', loc: 'desktop' } };

        function openFileInNotepad(dev, fileId, loc) {
            const list = loc === 'driveD' ? networkState.fs.desktop.driveD : networkState.fs[dev].desktop;
            const f = list.find(x => x.id === fileId);
            if (f) {
                notepadDraft[dev] = { name: f.name, content: f.content, loc };
            }
            openWinApp(dev, 'notepad');
        }

        function buildNotepadUI(dev) {
            const d = notepadDraft[dev];
            const canPrint = dev === 'desktop' ? isPrinterReadyLocally() : (isLaptopOnLAN() && isDesktopOnLAN() && isPrinterReadyLocally() && networkState.printerShared && networkState.laptopPrinterAdded);

            return `
            <div class="space-y-3 h-full flex flex-col">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 bg-slate-900 p-3 rounded-xl border border-white/10">
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">اسم الملف:</label>
                        <input id="np-name-${dev}" value="${d.name}" oninput="notepadDraft['${dev}'].name=this.value" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-950 border border-slate-700 text-white text-xs">
                    </div>
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">مكان الحفظ:</label>
                        <select id="np-loc-${dev}" onchange="notepadDraft['${dev}'].loc=this.value" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-950 border border-slate-700 text-white text-xs">
                            <option value="desktop" ${d.loc === 'desktop' ? 'selected' : ''}>سطح المكتب (Desktop)</option>
                            ${dev === 'desktop' ? `<option value="driveD" ${d.loc === 'driveD' ? 'selected' : ''}>القرص المحلي (D:)</option>` : ''}
                        </select>
                    </div>
                    <div class="flex items-end gap-2">
                        <button onclick="saveNotepadFile('${dev}')" class="flex-1 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold transition">
                            <i class="fa-solid fa-floppy-disk ml-1"></i> حفظ الملف
                        </button>
                        <button onclick="printFromNotepad('${dev}')" class="flex-1 py-2 rounded-lg ${canPrint ? 'bg-sky-600 hover:bg-sky-500 text-white' : 'bg-slate-800 text-slate-400'} text-xs font-extrabold transition">
                            <i class="fa-solid fa-print ml-1"></i> طباعة
                        </button>
                    </div>
                </div>

                <textarea id="np-content-${dev}" oninput="notepadDraft['${dev}'].content=this.value" placeholder="اكتب هنا النص الذي تريده (مثلاً اسمك ولقبك، أو ملخص حول الشبكة المحلية)..." class="flex-1 min-h-[240px] w-full p-4 rounded-xl bg-slate-950 border border-slate-700 text-white text-sm leading-relaxed focus:outline-none focus:border-sky-400 resize-none">${d.content}</textarea>

                ${!canPrint && dev === 'laptop' ? `
                    <div class="text-[11px] text-amber-300 bg-amber-950/30 border border-amber-500/25 px-3 py-2 rounded-xl">
                        <i class="fa-solid fa-circle-info ml-1"></i> للطباعة من المحمول، تأكد من مشاركة الطابعة في المكتبي وإضافتها في "الطابعات" بالمحمول.
                    </div>
                ` : ''}
            </div>
        `;
        }

        function saveNotepadFile(dev) {
            const nameRaw = (document.getElementById(`np-name-${dev}`).value || '').trim();
            const content = (document.getElementById(`np-content-${dev}`).value || '').trim();
            const loc = document.getElementById(`np-loc-${dev}`).value;

            if (!nameRaw || !content) {
                playSound('error');
                showToast('يرجى كتابة اسم للملف ومحتوى نصي قبل الحفظ!', 'error');
                return;
            }
            const finalName = nameRaw.endsWith('.txt') ? nameRaw : nameRaw + '.txt';
            const targetList = (dev === 'desktop' && loc === 'driveD') ? networkState.fs.desktop.driveD : networkState.fs[dev].desktop;

            const existing = targetList.find(f => f.name === finalName);
            if (existing) {
                existing.content = content;
                existing.custom = true;
            } else {
                targetList.unshift({ id: 'f_' + Date.now(), name: finalName, size: Math.max(1, Math.ceil(content.length / 20)) + ' KB', content, custom: true });
            }

            networkState.customFileCreated = true;
            if (dev === 'desktop' && loc === 'driveD') networkState.customFileSavedToD = true;

            playSound('success');
            showToast(`تم حفظ الملف "${finalName}" في ${loc === 'driveD' ? 'القرص D:' : 'سطح المكتب'} بنجاح!`, 'success');
            syncAllUI();
            renderActiveOS();
        }

        function printFromNotepad(dev) {
            const title = (document.getElementById(`np-name-${dev}`).value || 'وثيقة بدون عنوان').trim();
            const content = (document.getElementById(`np-content-${dev}`).value || '').trim();
            if (!content) {
                playSound('error');
                showToast('اكتب نصاً في المفكرة قبل إرسال أمر الطباعة!', 'error');
                return;
            }

            if (dev === 'desktop') {
                if (!isPrinterReadyLocally()) {
                    playSound('error');
                    showToast('الطابعة غير جاهزة! تأكد من توصيل كابل USB وتشغيل زر الطاقة الفيزيائي للطابعة.', 'error');
                    return;
                }
                networkState.lastPrintedDoc = { title, content, from: 'الحاسوب المكتبي (محلياً)' };
                trigger3DPrintAnimation(title, content);
                showToast('تمت الطباعة محلياً! يمكنك معاينة الورقة الخارجة من الطابعة.', 'success');
                openPrintedPaperModal();
            } else {
                if (!(isLaptopOnLAN() && isDesktopOnLAN() && isPrinterReadyLocally() && networkState.printerShared && networkState.laptopPrinterAdded)) {
                    playSound('error');
                    showToast('لا توجد طابعة شبكة مضافة! شارك الطابعة من المكتبي ثم أضفها من تطبيق الطابعات في المحمول.', 'error');
                    return;
                }
                networkState.networkPrintDone = true;
                networkState.lastPrintedDoc = { title, content, from: 'الحاسوب المحمول عبر الشبكة المحلية (LAN)' };
                trigger3DPrintAnimation(title, content);
                playSound('success');
                showToast('ممتاز! تم إرسال الملف عبر الشبكة والورقة تخرج الآن من الطابعة 3D!', 'success');
                syncAllUI();
                openPrintedPaperModal();
            }
        }

        // -------------------------------------------------------------------------
        // مستكشف الملفات (File Explorer) ومشاركة القرص D:
        // -------------------------------------------------------------------------
        function buildExplorerUI(dev) {
            const st = uiState[dev];
            const isDesk = dev === 'desktop';
            const tabs = isDesk
                ? [
                    { id: 'desktop', label: 'سطح المكتب', icon: 'fa-desktop' },
                    { id: 'driveC', label: 'القرص (C:)', icon: 'fa-hard-drive' },
                    { id: 'driveD', label: 'القرص (D:)', icon: 'fa-hard-drive' },
                    { id: 'downloads', label: 'التنزيلات', icon: 'fa-download' },
                    { id: 'network', label: 'الشبكة', icon: 'fa-network-wired' }
                ]
                : [
                    { id: 'desktop', label: 'سطح المكتب', icon: 'fa-desktop' },
                    { id: 'downloads', label: 'التنزيلات', icon: 'fa-download' },
                    { id: 'network', label: 'الشبكة (Network)', icon: 'fa-network-wired' }
                ];

            let mainContent = '';
            if (st.explorerTab === 'desktop') {
                mainContent = renderFileList(networkState.fs[dev].desktop, dev, 'desktop');
            } else if (st.explorerTab === 'downloads') {
                mainContent = renderFileList(networkState.fs[dev].downloads, dev, 'downloads');
            } else if (st.explorerTab === 'driveC') {
                mainContent = `<div class="p-4 rounded-xl bg-slate-900 border border-white/10 text-xs text-slate-400 space-y-2"><i class="fa-solid fa-shield-halved text-sky-400 text-2xl"></i><p class="font-bold text-white">ملفات نظام التشغيل Windows (محمية)</p><p>يفضل حفظ ملفات العمل التطبيقي ومشاركتها عبر القرص D:.</p></div>`;
            } else if (st.explorerTab === 'driveD') {
                mainContent = `
                <div class="space-y-3">
                    <div class="p-3 rounded-xl bg-slate-900 border ${networkState.driveDShared ? 'border-emerald-400/60' : 'border-amber-400/40'} flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-2.5">
                            <i class="fa-solid fa-hard-drive text-2xl ${networkState.driveDShared ? 'text-emerald-400' : 'text-amber-400'}"></i>
                            <div>
                                <div class="text-xs font-extrabold text-white">القرص المحلي (D:) ${networkState.driveDShared ? '<span class="text-emerald-400">(مشترك على الشبكة ✓)</span>' : ''}</div>
                                <div class="text-[11px] text-slate-400">الصلاحيات: ${networkState.driveDShared ? (networkState.driveDPermission === 'readwrite' ? 'قراءة وكتابة' : 'قراءة فقط') : 'غير مشترك'}</div>
                            </div>
                        </div>
                        <button onclick="uiState.desktop.showPropD = true; renderActiveOS()" class="px-3.5 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-extrabold">
                            <i class="fa-solid fa-sliders ml-1"></i> خصائص (Properties) / مشاركة
                        </button>
                    </div>
                    ${renderFileList(networkState.fs.desktop.driveD, 'desktop', 'driveD')}

                    ${st.showPropD ? `
                        <div class="p-4 rounded-2xl bg-slate-900 border-2 border-sky-400/70 shadow-2xl space-y-3">
                            <div class="flex items-center justify-between border-b border-white/10 pb-2">
                                <span class="text-xs font-extrabold text-sky-300">خصائص القرص (D:) • تبويب المشاركة (Sharing)</span>
                                <button onclick="uiState.desktop.showPropD=false; renderActiveOS()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                            <label class="flex items-center gap-3 p-3 rounded-xl bg-slate-950 border border-white/10 cursor-pointer">
                                <input type="checkbox" ${networkState.driveDShared ? 'checked' : ''} onchange="setDriveDShare(this.checked)" class="w-5 h-5 accent-emerald-500">
                                <span class="text-xs font-extrabold text-white">مشاركة هذا القرص على الشبكة المحلية (Share this drive)</span>
                            </label>
                            ${networkState.driveDShared ? `
                                <div class="flex items-center gap-3 text-xs bg-slate-950 p-3 rounded-xl border border-white/10">
                                    <span class="text-slate-300 font-bold">صلاحيات الوصول:</span>
                                    <select onchange="networkState.driveDPermission=this.value; syncAllUI(); renderActiveOS()" class="px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-600 text-white text-xs">
                                        <option value="readwrite" ${networkState.driveDPermission === 'readwrite' ? 'selected' : ''}>قراءة وكتابة (Read/Write)</option>
                                        <option value="read" ${networkState.driveDPermission === 'read' ? 'selected' : ''}>قراءة فقط (Read Only)</option>
                                    </select>
                                </div>
                            ` : ''}
                        </div>
                    ` : ''}
                </div>
            `;
            } else if (st.explorerTab === 'network') {
                const lanOK = isDesktopOnLAN() && isLaptopOnLAN();
                if (!lanOK) {
                    mainContent = `<div class="p-6 rounded-xl bg-slate-900 border border-rose-500/30 text-center text-xs text-rose-300">لا توجد أجهزة أخرى مرئية على الشبكة المحلية حالياً. تأكد من اتصال المكتبي بـ RJ45 والمحمول بـ Wi-Fi.</div>`;
                } else if (isDesk) {
                    mainContent = `<div class="p-4 rounded-xl bg-slate-900 border border-sky-500/30 flex items-center gap-3"><i class="fa-solid fa-laptop text-2xl text-indigo-400"></i><div><div class="text-xs font-extrabold text-white">LAPTOP-STUDENT</div><div class="text-[11px] font-mono text-emerald-400" dir="ltr">192.168.1.3</div></div></div>`;
                } else {
                    mainContent = `
                    <div class="space-y-3">
                        <div class="p-4 rounded-xl bg-slate-900 border border-sky-500/40 flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-desktop text-3xl text-sky-400"></i>
                                <div>
                                    <div class="text-sm font-extrabold text-white">DESKTOP-PC</div>
                                    <div class="text-[11px] font-mono text-emerald-400" dir="ltr">\\\\192.168.1.2</div>
                                </div>
                            </div>
                            ${networkState.driveDShared
                            ? `<button onclick="openSharedDriveDFromLaptop()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold"><i class="fa-solid fa-folder-open ml-1"></i> فتح القرص المشترك (D:)</button>`
                            : `<span class="text-[11px] text-amber-300 bg-amber-950/40 px-3 py-1.5 rounded-lg border border-amber-500/30">القرص D: غير مشترك بعد (فعّل مشاركته من المكتبي)</span>`}
                        </div>
                    </div>
                `;
                }
            } else if (st.explorerTab === 'sharedD') {
                mainContent = `
                <div class="space-y-3">
                    <div class="flex items-center justify-between bg-emerald-950/40 border border-emerald-500/40 px-3 py-2 rounded-xl text-xs">
                        <span class="font-mono font-bold text-emerald-300" dir="ltr">\\\\DESKTOP-PC\\Drive_D</span>
                        <button onclick="uiState.laptop.explorerTab='network'; renderActiveOS()" class="text-sky-400 font-bold">رجوع للشبكة</button>
                    </div>
                    ${renderFileList(networkState.fs.desktop.driveD, 'laptop', 'sharedD')}
                </div>
            `;
            }

            return `
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3 h-full">
                <div class="bg-slate-900 rounded-xl border border-white/10 p-2 space-y-1">
                    ${tabs.map(t => `
                        <button onclick="uiState['${dev}'].explorerTab='${t.id}'; uiState['${dev}'].previewFile=null; renderActiveOS()" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-bold transition ${st.explorerTab === t.id || (t.id === 'network' && st.explorerTab === 'sharedD') ? 'bg-sky-600 text-white' : 'text-slate-300 hover:bg-slate-800'}">
                            <i class="fa-solid ${t.icon} w-4"></i><span>${t.label}</span>
                        </button>
                    `).join('')}
                </div>
                <div class="md:col-span-3 space-y-3">
                    ${mainContent}
                    ${st.previewFile ? `
                        <div class="p-4 rounded-xl bg-slate-900 border border-sky-400/50 space-y-2">
                            <div class="flex justify-between items-center border-b border-white/10 pb-1.5">
                                <span class="text-xs font-extrabold text-sky-300">معاينة: ${st.previewFile.name}</span>
                                <button onclick="uiState['${dev}'].previewFile=null; renderActiveOS()" class="text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                            <div class="text-xs text-slate-200 whitespace-pre-line leading-relaxed">${st.previewFile.content}</div>
                        </div>
                    ` : ''}
                </div>
            </div>

            `;

            return `

                    <button onclick="setModemTab('dhcp')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold ${tab === 'dhcp' ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-300'}"><i class="fa-solid fa-table-list ml-1"></i>الأجهزة المتصلة (DHCP)</button>
                </div>

                ${tab === 'status' ? `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">

                            <div class="font-extrabold text-sky-300">حالة الألياف البصرية (WAN / PON)</div>
                            <div class="flex justify-between"><span class="text-slate-400">حالة الإشارة الضوئية:</span><span class="${hasInternet() ? 'text-emerald-400' : 'text-rose-400'} font-bold">${hasInternet() ? 'متصل (PON -18.4 dBm)' : 'مفقودة (LOS)'}</span></div>
                            <div class="flex justify-between"><span class="text-slate-400">بوابة الشبكة (Gateway):</span><span class="font-mono text-white" dir="ltr">192.168.1.1</span></div>
                            <div class="flex justify-between"><span class="text-slate-400">قناع الشبكة:</span><span class="font-mono text-white" dir="ltr">255.255.255.0</span></div>
                        </div>
                        <div class="p-3.5 rounded-xl bg-slate-950 border border-white/10 space-y-2">

                            <div class="flex justify-between"><span class="text-slate-400">اسم الشبكة (SSID):</span><span class="font-mono text-amber-300 font-bold" dir="ltr">${networkState.ssid}</span></div>
                            <div class="flex justify-between"><span class="text-slate-400">التشفير:</span><span class="font-mono text-white" dir="ltr">${networkState.wifiSecurity}</span></div>
                            <div class="flex justify-between"><span class="text-slate-400">عدد الأجهزة المتصلة:</span><span class="font-bold text-sky-300">${connectedDevices.length} أجهزة</span></div>

                    </div>
                ` : tab === 'wlan' ? `
                    <div class="max-w-lg bg-slate-950 p-4 rounded-xl border border-white/10 space-y-3 text-xs">
                        <div>
                            <label class="block text-slate-300 mb-1">اسم الشبكة الجديدة (SSID):</label>
                            <input id="wlan-ssid" value="${networkState.ssid}" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white font-mono" dir="ltr">
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1">بروتوكول التشفير (Security Mode):</label>
                            <select id="wlan-sec" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white font-mono" dir="ltr">
                                <option value="WPA2-PSK" ${networkState.wifiSecurity === 'WPA2-PSK' ? 'selected' : ''}>WPA2-PSK (موصى به)</option>
                                <option value="WPA3-SAE" ${networkState.wifiSecurity === 'WPA3-SAE' ? 'selected' : ''}>WPA3-SAE</option>
                                <option value="Open" ${networkState.wifiSecurity === 'Open' ? 'selected' : ''}>مفتوحة (غير آمنة)</option>
                            </select>
                        </div>
                        <div>

                            <i class="fa-solid fa-check ml-1"></i> تطبيق وحفظ الإعدادات (Apply)
                        </button>

                ` : `
                    <div class="space-y-3">

                        </div>

        function setModemTab(tab) {
            playSound('click');
            uiState.desktop.modemTab = tab;
